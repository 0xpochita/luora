<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luora Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e1016; --panel:#14171f; --card:#1a1e28; --ink:#e8e6f1; --muted:#8b8fa3; --line:#252a36; --soft:#20242f; --hi:#2b3142;
  --usdc:#3d8ee6; --actor:#a78bfa; --contract:#e8e6f1; --ext:#4f8df7; --int:#14b8c4; --store:#f59e0b; --dep:#22c55e;
  --warn:#e8b339; --bad:#f0603f; --ok:#34c47c; --accent:#7c6cff;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;overflow:hidden;display:grid;
  grid-template:"top top top" 48px "left canvas right" 1fr "left time right" 150px / 248px 1fr 400px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- top bar (figma-like) ---------- */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.mark{width:22px;height:22px;border-radius:6px;background:conic-gradient(var(--usdc) 0 25%,#fff 0 50%,var(--usdc) 0 75%,#fff 0);border:2px solid var(--ink)}
.file{color:var(--muted);font-size:12.5px}
.file b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:2px;margin:0 auto;background:var(--card);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tools button{height:32px;min-width:38px;padding:0 10px;border:0;border-radius:8px;background:none;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#c6c8d4}
.tools button kbd{font:500 10px var(--mono);color:var(--muted)}
.tools button:hover{background:var(--soft)}
.tools button.on{background:var(--accent);color:#fff}
.tools button.on kbd{color:#e6e2ff}
.me{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7c6cff,#3d8ee6);display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--panel);outline:2px solid #7c6cff}
.pill{height:32px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{background:var(--soft)}
.pill.dark{background:var(--ink);color:var(--bg)}
.pill.sm{height:28px;padding:0 11px;font-size:12px;border-width:1.5px}
select.pill{appearance:none}

/* ---------- left panel: layers / assets ---------- */
.left{grid-area:left;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:4px 8px;border-radius:6px;font-weight:600;color:var(--muted);font-size:12px}
.tabs button.on{color:var(--ink);background:var(--soft)}
.scroll{overflow:auto;flex:1;padding:6px 0 20px}
.sec{padding:10px 12px 4px;font:600 10.5px Inter;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.sec span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.item{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 18px;font-size:12.5px;cursor:pointer;color:#cfd1dc;white-space:nowrap}
.item.sub{padding-left:32px;color:#a9acba}
.item:hover{background:var(--soft)}
.item.sel{background:rgba(124,108,255,.18);color:#fff;box-shadow:inset 2px 0 var(--accent)}
.item i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.item small{margin-left:auto;color:var(--muted);font-size:11px}
.item .x{margin-left:6px;border:0;background:none;color:var(--muted);padding:0 2px;visibility:hidden}
.item:hover .x{visibility:visible}
.item .bpdot{width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:4px}
.asset{margin:8px 10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:grab;display:flex;gap:10px;align-items:center}
.asset:hover{border-color:var(--c)}
.asset.placed{opacity:.5;cursor:default}
.av{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 25%,var(--card));border:2px solid var(--c);display:grid;place-items:center;font-size:16px;flex:none}
.asset b{display:block;font-size:12.5px}
.asset span{font-size:11px;color:var(--muted)}
.tip{margin:10px 12px;padding:10px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:11.5px}

/* ---------- canvas ---------- */
#viewport{grid-area:canvas;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#171b27,var(--bg) 70%);min-width:0}
#viewport canvas{display:block}
#viewport.connect canvas{cursor:crosshair}
.labels{position:absolute;inset:0;pointer-events:none;z-index:1} /* own stacking context: CSS2D sets per-label z-index */
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:12px;background:rgba(20,23,31,.9);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:#c6c8d4;z-index:4;white-space:nowrap}
.hint b{color:var(--accent)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;z-index:4}
.zoom button{width:30px;height:28px;border:0;border-radius:7px;background:none}
.zoom button:hover{background:var(--soft)}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:16px;display:none;place-items:center;color:var(--accent);font-weight:600;z-index:5;pointer-events:none;background:rgba(124,108,255,.06)}
#viewport.dragging .drop{display:grid}

.lab{pointer-events:auto;cursor:pointer;background:rgba(18,21,30,.92);border:2px solid color-mix(in srgb,var(--c) 70%,#000);border-radius:11px;font:11.5px var(--mono);
  box-shadow:0 10px 26px rgba(0,0,0,.45);transition:transform .25s cubic-bezier(.2,1.3,.4,1),border-color .2s,box-shadow .2s;transform:translateY(-6px)}
.lh{display:flex;align-items:center;gap:7px;padding:5px 9px;font-weight:600;white-space:nowrap}
.lh i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.lh small{font:600 9.5px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.lab:not(.open) .lh small{display:none}
.lh .pv{margin-left:6px;color:#cfd3e6;font-weight:500}
.lrows{display:none;border-top:1px solid #2a2f3e;padding:2px 0}
.lab.open .lrows{display:block}
.lab.open .pv{display:none}
.lab.active{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 14px 30px rgba(0,0,0,.5);transform:translateY(-14px) scale(1.04)}
.lab.bad{border-color:var(--bad);box-shadow:0 0 0 4px rgba(240,96,63,.3),0 14px 30px rgba(0,0,0,.5)}
.lab.sel{outline:2px solid var(--accent);outline-offset:3px}
.lab.from{outline:2px dashed var(--accent);outline-offset:4px}
.row{display:flex;gap:10px;padding:3px 10px;white-space:nowrap;transition:background .3s}
.row .key{color:#7cb2f0}
.row .val{margin-left:auto}
.row.warn .key,.row.warn .val{color:var(--warn)}
.row.up{background:rgba(52,196,124,.18)}.row.down{background:rgba(240,96,63,.18)}
.elab{font:500 11px Inter;color:#6f7489;white-space:nowrap;pointer-events:none}
.elab.on{color:var(--ink)}
.alab{font:700 10.5px Inter;color:#fff;background:var(--c);border-radius:999px;padding:2px 8px;white-space:nowrap;border:2px solid #07080c;pointer-events:none}
.mlab{font:700 11px Inter;color:#fff;background:var(--usdc);border-radius:999px;padding:2px 8px;border:2px solid #07080c;white-space:nowrap;opacity:.85}
.fdelta{font:700 12px Inter;padding:2px 8px;border-radius:999px;border:2px solid #07080c;background:var(--card);white-space:nowrap;animation:rise 1.6s forwards;pointer-events:none}
.fdelta.up{color:var(--ok)}.fdelta.down{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.bp{font:700 10px Inter;color:#fff;background:var(--bad);border-radius:999px;padding:2px 7px;border:2px solid #07080c;pointer-events:none}
.pin{pointer-events:auto;display:flex;align-items:flex-start;gap:6px;cursor:default}
.pin .a{width:24px;height:24px;border-radius:50% 50% 50% 2px;display:grid;place-items:center;font:700 10px Inter;color:#fff;background:var(--pc);border:2px solid #07080c;flex:none}
.pin .t{display:none;max-width:220px;white-space:normal;font:12px/1.4 Inter;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pin .t b{display:block;font-size:11px;color:var(--pc)}
.pin:hover .t{display:block}
.bubble{position:absolute;left:0;top:0;pointer-events:none;font:700 12px Inter;color:#fff;background:var(--usdc);border:2px solid #07080c;border-radius:999px;padding:3px 10px;
  transform:translate(-50%,-170%);opacity:0;transition:opacity .2s;white-space:nowrap;z-index:3}

/* popover (connect / comment) */
.pop{position:absolute;z-index:8;width:270px;background:var(--panel);border:1px solid #343a4c;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.55);padding:12px;display:none}
.pop.on{display:block}
.pop h4{margin:0 0 8px;font-size:12.5px}
.pop h4 span{color:var(--muted);font-weight:500}
.opt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.opt:hover,.opt.on{background:var(--soft);border-color:var(--line)}
.opt code{font:600 12px var(--mono)}
.opt small{margin-left:auto;color:var(--muted)}
.pop input,.pop textarea{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:12.5px var(--mono);resize:none}
.pop .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.pop .none{color:var(--muted);font-size:12px;padding:4px 2px}

/* ---------- right panel ---------- */
.right{grid-area:right;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp{padding:12px 14px;border-bottom:1px solid var(--line);max-height:42%;overflow:auto}
.insp h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.insp h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.insp h3 small{margin-left:auto;font:600 10px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.props{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;font:12px var(--mono)}
.props .row{padding:5px 10px;border-top:1px solid var(--line)}
.props .row:first-child{border-top:0}
.ibtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:12px}
.ai{margin:12px 14px 0;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#1b1e2a;font-size:12.5px}
.ai b.h{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.ai h4{margin:0 0 2px;font-size:13px}
.ai .sub{color:var(--muted);font:11px var(--mono);margin-bottom:6px}
.ai.bad{background:rgba(240,96,63,.1);border-color:var(--bad)}.ai.bad b.h{color:var(--bad)}
.ai.warn{background:rgba(232,179,57,.1);border-color:var(--warn)}.ai.warn b.h{color:var(--warn)}
.ai.pause{border-color:var(--accent);background:rgba(124,108,255,.1)}.ai.pause b.h{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font:500 11px var(--mono);border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
.chip.up{border-color:var(--ok);color:var(--ok)}.chip.down{border-color:var(--bad);color:var(--bad)}
table.bc{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
table.bc td{padding:4px 2px;border-top:1px solid var(--line)}
table.bc td+td{text-align:right;font:600 12px var(--mono)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.ed-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font:600 12.5px var(--mono)}
.ed-head span{margin-left:auto;font:400 11px Inter;color:var(--muted)}
pre#code{margin:0;flex:1;overflow:auto;padding:4px 0 40px;font:12px/1.7 var(--mono);color:#d7d6e2;border-top:1px solid var(--line)}
.l{display:block;position:relative;padding-right:14px;transition:background .2s}
.ln{display:inline-block;width:42px;padding-right:12px;text-align:right;color:#4b5063;user-select:none}
.l.cur{background:rgba(232,179,57,.16);box-shadow:inset 3px 0 var(--warn)}
.l.cur.bad{background:rgba(240,96,63,.18);box-shadow:inset 3px 0 var(--bad)}
.l.peek{background:rgba(124,108,255,.16);box-shadow:inset 3px 0 var(--accent)}
.l.fd:before{content:"";position:absolute;left:6px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.k{color:#ff9b6b}.t{color:#5fd0e0}.s{color:#a7d675}.c{color:#666b7e;font-style:italic}.num{color:#f0b85a}

/* ---------- timeline ---------- */
.time{grid-area:time;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.th{display:flex;align-items:center;gap:8px;padding:8px 12px}
.th b{font-size:12.5px}
.th span{color:var(--muted);font-size:12px}
.th .spacer{flex:1}
.acts-row{display:flex;gap:6px;padding:2px 12px 8px;overflow-x:auto;min-height:40px;align-items:center}
.act{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:12px}
.act i{font:600 10px var(--mono);color:var(--muted)}
.act .who{width:8px;height:8px;border-radius:50%;background:var(--c)}
.act code{font:600 11.5px var(--mono)}
.act.cur{border-color:var(--accent);background:rgba(124,108,255,.14)}
.act button{border:0;background:none;color:var(--muted);padding:0 3px}
.act button:hover{color:var(--bad)}
.add{color:var(--muted);font-size:12px;border:1px dashed #3a4052;border-radius:9px;padding:6px 10px;white-space:nowrap}
.strip{display:flex;gap:3px;padding:0 12px 10px;overflow-x:auto}
.sg{font:600 9.5px var(--mono);padding:3px 6px;border-radius:5px;background:var(--soft);color:#6d7084;white-space:nowrap;border:1px solid transparent}
.sg.done{color:var(--ink);background:var(--hi)}
.sg.cur{border-color:var(--accent);color:#fff;background:rgba(124,108,255,.3)}
.sg.warn.done{color:var(--warn)}.sg.bad.done{color:var(--bad)}
.sg.bpk{box-shadow:inset 0 -2px var(--bad)}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><span class="mark"></span>Luora Studio</div>
  <div class="file">Audits / <b>LuoraVault</b> / <span id="fileScen">Untitled scenario</span></div>
  <div class="tools" id="tools">
    <button data-tool="select" class="on" title="Select (V)">↖ <kbd>V</kbd></button>
    <button data-tool="hand" title="Hand / orbit (H)">✋ <kbd>H</kbd></button>
    <button data-tool="connect" title="Connect actor → target (C)">⤳ Connect <kbd>C</kbd></button>
    <button data-tool="breakpoint" title="Breakpoint (B)">● Breakpoint <kbd>B</kbd></button>
    <button data-tool="comment" title="Comment (K)">💬 <kbd>K</kbd></button>

  <div class="me" title="You">Y</div>
</header>

<aside class="left">
  <div class="tabs"><button class="on" data-tab="layers">Layers</button><button data-tab="assets">Assets</button></div>

<section id="viewport">

  <div class="insp" id="insp"></div>

</aside>

<section class="time">
  <div class="th"><b>Scenario</b><span id="tmeta"></span><div class="spacer"></div>
    <select class="pill sm" id="speed" title="Speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <button class="pill sm" id="reset">↺ Reset</button>
    <button class="pill sm" id="step">Step ›</button>
    <button class="pill dark sm" id="run">▶ Run</button>
  </div>
  <div class="acts-row" id="acts"></div>
  <div class="strip" id="strip"></div>
</section>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const $ = id => document.getElementById(id);

// ================= source =================
const SRC = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

import {IERC20} from "./IERC20.sol";
import {IOracle} from "./IOracle.sol";
import {IStrategy} from "./IStrategy.sol";

/// @title LuoraVault — USDC yield vault (sample with planted bugs)
contract LuoraVault {
    address public owner;
    IERC20 public asset;          // USDC
    IOracle public oracle;        // spot price from a DEX pool
    IStrategy public strategy;
    uint256 public totalShares;
    mapping(address => uint256) public shares;
    bool public paused;
    uint256 public feeBps = 50;

    event Deposit(address indexed user, uint256 assets, uint256 shares);
    event Withdraw(address indexed user, uint256 assets, uint256 shares);

    modifier whenNotPaused() {
        require(!paused, "paused");
        _;
    }

    modifier onlyOwner() {
        require(msg.sender == owner, "!owner");
        _;
    }

    constructor(IERC20 _asset, IOracle _oracle, IStrategy _strategy) {
        owner = msg.sender;
        asset = _asset;
        oracle = _oracle;
        strategy = _strategy;
    }

    function deposit(uint256 amount) external whenNotPaused {
        uint256 minted = _computeShares(amount);
        asset.transferFrom(msg.sender, address(this), amount);
        shares[msg.sender] += minted;
        totalShares += minted;
        emit Deposit(msg.sender, amount, minted);
    }

    function withdraw(uint256 shareAmount) external whenNotPaused {
        require(shares[msg.sender] >= shareAmount, "!shares");
        uint256 value = shareAmount * _price() / 1e18;
        asset.transfer(msg.sender, value);
        shares[msg.sender] -= shareAmount;
        totalShares -= shareAmount;
        emit Withdraw(msg.sender, value, shareAmount);
    }

    function harvest() external {
        uint256 bal = asset.balanceOf(address(this));
        asset.transfer(address(strategy), bal);
        uint256 profit = strategy.invest(bal);
        _accrueFee(profit);
    }

    function setOracle(IOracle newOracle) external onlyOwner {
        oracle = newOracle;
    }

    function _computeShares(uint256 amount) internal view returns (uint256) {
        if (totalShares == 0) return amount;
        return amount * 1e18 / _price();
    }

    function _price() internal view returns (uint256) {
        return oracle.getSpotPrice(address(asset));
    }

    function _accrueFee(uint256 profit) internal {
        uint256 fee = profit * feeBps / 10_000;
        shares[owner] += fee;
        totalShares += fee;
    }
}`;

const LINES = SRC.split('\n');
const lineOf = a => Math.max(0, LINES.findIndex(l => l.includes(a)));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = 'pragma|solidity|import|from|contract|function|modifier|event|emit|returns|return|require|if|external|internal|public|view|constructor|mapping|indexed';
const TY = 'address|uint256|bool|IERC20|IOracle|IStrategy';
const RE = new RegExp(`(\\/\\/.*$)|("[^"]*")|\\b(${KW})\\b|\\b(${TY})\\b|\\b(\\d[\\d_]*(?:e\\d+)?)\\b`,'g');
const hl = l => esc(l).replace(RE,(m,c,s,k,t)=>`<span class="${c?'c':s?'s':k?'k':t?'t':'num'}">${m}</span>`);
const FINDINGS = {'return oracle.getSpotPrice':'F-02 spot price oracle — manipulable with a flash loan',
  'asset.transferFrom':'F-03 unchecked ERC20 return value', 'asset.transfer(msg.sender':'F-01 transfer before shares are burned (CEI)',

// ================= state + compile (actions → steps) =================
const priceOf = s => (s['usdc.pool'] / s['weth.pool']) / 2500;
const NM = id => byId[id].title;
const ACT = {
  deposit:  {target:['vault','deposit'], fn:'deposit', arg:'amount', unit:'USDC', def:1000},
  withdraw: {target:['vault','withdraw'], fn:'withdraw', arg:'shares', unit:'shares', def:null},
  harvest:  {target:['vault','harvest'], fn:'harvest'},
  setOracle:{target:['vault','setOracle'], fn:'setOracle'},
  flashLoan:{target:['aave'], fn:'flashLoan', arg:'amount', unit:'USDC', def:500000},
  repay:    {target:['aave'], fn:'repay'},
  swapIn:   {target:['pool'], fn:'swap USDC→WETH', arg:'amount', unit:'USDC', def:500000},
  swapOut:  {target:['pool'], fn:'swap WETH→USDC', arg:'all WETH'},

const actLabel = a => `${ACT[a.type].fn}${a.amount != null ? ' ' + fm(a.amount) : ''}`;
function oracleStep(s, edges){
  const p = priceOf(s), bad = Math.abs(p - 1) > .05;
  return {kind:'STATICCALL', node:'oracle', edges, code:['function _price',3], flag: bad ? 'bad' : 'warn', title:`_price() → SpotOracle → $${p.toFixed(2)}${bad ? ' (manipulated)' : ''}`,
    why: bad ? `F-02 triggered: spot price is ${p.toFixed(2)}× fair because pool reserves were skewed earlier in this flow. A TWAP / Chainlink feed would still read ~$1.00.`

}
function compile(acts){
  const s = {...BASE}, out = [], loans = {};
  acts.forEach((a, ai) => {
    const A = a.actor, nm = NM(A), P = st => out.push({...st, act: ai});
    const revert = (node, title, why, code) => P({kind:'REVERT', node, flag:'bad', code, title, why});
    if (a.type === 'deposit') {
      P({kind:'CALL', node:A, edges:[`${A}>vault`,'vault>deposit'], code:['function deposit',1], title:`${nm} → deposit(${fm(a.amount)} USDC)`, why:`External entry point. ${nm} approved the vault to pull ${fm(a.amount)} USDC.`});
      if (s['usdc.'+A] < a.amount) return revert('usdc', `transferFrom reverts — ${nm} only has ${fm(s['usdc.'+A])} USDC`, 'Balance too low. The whole call reverts; no state changes.', ['asset.transferFrom',1]);
      P({kind:'CHECK', node:'deposit', code:['modifier whenNotPaused',4], title:'whenNotPaused → paused == false ✓', why:'paused is never written anywhere, so this gate can never close.'});
      const empty = s.totalShares === 0, p = priceOf(s);
      P({kind:'CALL', node:'_computeShares', edges:['deposit>_computeShares'], code:['function _computeShares',4], flag: empty ? 'warn' : undefined, title:`_computeShares(${fm(a.amount)})`,
         why: empty ? 'totalShares == 0 → minted 1:1 (F-05 first-depositor inflation).' : `totalShares = ${fm(s.totalShares)} → shares = amount / _price().`});
      if (!empty) P(oracleStep(s, ['_computeShares>_price','_price>oracle','oracle>pool']));
      const minted = Math.round(empty ? a.amount : a.amount / p), off = Math.abs(p - 1) > .05;
      P({kind:'RETURN', node:'deposit', code:['uint256 minted',1], flag: off ? 'bad' : undefined, title:`minted = ${fm(minted)} shares`,
         why: off ? `Price is $${p.toFixed(2)} instead of ~$1.00 — ${nm} gets ${p > 1 ? 'fewer' : 'more'} shares than fair.` : `${fm(a.amount)} / ${p.toFixed(2)} = ${fm(minted)} shares.`});
      P({kind:'TRANSFER', node:'usdc', edges:['deposit>usdc'], code:['asset.transferFrom',1], flag:'warn', title:`USDC.transferFrom(${nm} → Vault, ${fm(a.amount)})`,
         transfer:{from:A, to:'vault', amt:a.amount}, why:'Funds move into the vault. The bool return value is ignored (F-03).'});
      s['usdc.'+A] -= a.amount; s['usdc.vault'] += a.amount; s['shares.'+A] += minted; s.totalShares += minted;
      P({kind:'SSTORE', node:'storage', edges:['deposit>storage'], code:['shares[msg.sender] += minted',2], title:`shares[${nm}] += ${fm(minted)} · totalShares += ${fm(minted)}`,
         set:{['shares.'+A]:s['shares.'+A], totalShares:s.totalShares}, why:`${nm} now owns ${(s['shares.'+A]/s.totalShares*100).toFixed(1)}% of the vault.`});
      P({kind:'EVENT', node:'vault', code:['emit Deposit(',1], title:`emit Deposit(${nm}, ${fm(a.amount)}, ${fm(minted)})`, why:'Indexers and monitors see the deposit.'});
    }
    if (a.type === 'withdraw') {
      P({kind:'CALL', node:A, edges:[`${A}>vault`,'vault>withdraw'], code:['function withdraw',1], title:`${nm} → withdraw(${fm(a.amount)} shares)`, why:'External entry point, gated by whenNotPaused.'});
      if (s['shares.'+A] < a.amount) return revert('storage', `require fails — ${nm} has ${fm(s['shares.'+A])} shares`, 'require(shares[msg.sender] >= shareAmount) reverts the call.', ['require(shares[msg.sender]',1]);
      P({kind:'CHECK', node:'withdraw', code:['require(shares[msg.sender]',1], title:`require(shares[${nm}] ≥ ${fm(a.amount)}) ✓`, why:`${nm} holds ${fm(s['shares.'+A])} shares.`});
      P(oracleStep(s, ['withdraw>_price','_price>oracle','oracle>pool']));
      const p = priceOf(s), value = Math.round(a.amount * p), off = Math.abs(p - 1) > .05;
      P({kind:'RETURN', node:'withdraw', code:['uint256 value',1], flag: off ? 'bad' : undefined, title:`value = ${fm(a.amount)} × ${p.toFixed(2)} = ${fm(value)} USDC`,
         why: off ? `${p.toFixed(2)}× the fair redemption value — the difference comes out of other depositors.` : 'Shares × price.'});
      if (value > s['usdc.vault']) return revert('usdc', `transfer reverts — vault only holds ${fm(s['usdc.vault'])} USDC`, 'Not enough USDC in the vault; the call reverts.', ['asset.transfer(msg.sender',1]);
      P({kind:'TRANSFER', node:'usdc', edges:['withdraw>usdc'], code:['asset.transfer(msg.sender',1], flag:'bad', title:`USDC.transfer(Vault → ${nm}, ${fm(value)})`,
         transfer:{from:'vault', to:A, amt:value}, why:'Funds leave BEFORE shares are burned (F-01, CEI). With a hook token the receiver could re-enter here.'});
      s['usdc.vault'] -= value; s['usdc.'+A] += value; s['shares.'+A] -= a.amount; s.totalShares -= a.amount;
      P({kind:'SSTORE', node:'storage', edges:['withdraw>storage'], code:['shares[msg.sender] -= shareAmount',2], title:`shares[${nm}] −= ${fm(a.amount)} · totalShares −= ${fm(a.amount)}`,
         set:{['shares.'+A]:s['shares.'+A], totalShares:s.totalShares}, why:'Effects happen last. Correct order: burn first, then transfer.'});
      P({kind:'EVENT', node:'vault', code:['emit Withdraw(',1], title:`emit Withdraw(${nm}, ${fm(value)}, ${fm(a.amount)})`, why:'Done.'});
    }
    if (a.type === 'harvest') {
      P({kind:'CALL', node:A, edges:[`${A}>vault`,'vault>harvest'], code:['function harvest',1], flag:'warn', title:`${nm} → harvest()`, why:'No modifier: any address can trigger this at any time (F-06).'});

      P({kind:'STATICCALL', node:'usdc', code:['uint256 bal',1], title:`USDC.balanceOf(Vault) → ${fm(bal)}`, why:'Reads the full vault balance.'});
      if (!bal) return;
      P({kind:'TRANSFER', node:'usdc', edges:['harvest>usdc'], code:['asset.transfer(address(strategy)',1], flag:'warn', title:`USDC.transfer(Vault → Strategy, ${fm(bal)})`,
         transfer:{from:'vault', to:'strategy', amt:bal}, why:'100% of user funds leave the vault in one call. If the strategy is compromised, everything is gone.'});
      s['usdc.vault'] = 0; s['usdc.strategy'] += bal; const profit = Math.round(bal * .02); s.profit = profit;
      P({kind:'CALL', node:'strategy', edges:['harvest>strategy'], code:['strategy.invest(bal)',1], flag:'warn', title:`Strategy.invest(${fm(bal)}) → profit ${fm(profit)}`, set:{profit}, why:'The vault trusts whatever profit number the strategy reports.'});
      const fee = Math.round(profit * 50 / 10000); s['shares.owner'] += fee; s.totalShares += fee;
      P({kind:'CALL', node:'_accrueFee', edges:['harvest>_accrueFee'], code:['function _accrueFee',5], title:`_accrueFee(${fm(profit)}) → fee = ${fm(fee)} shares`, why:`${fm(profit)} × 50 / 10,000.`});
      P({kind:'SSTORE', node:'storage', edges:['_accrueFee>storage'], code:['shares[owner] += fee',2], title:`shares[owner] += ${fm(fee)}`, set:{'shares.owner':s['shares.owner'], totalShares:s.totalShares}, why:'Fee minted as shares, diluting depositors.'});
    }
    if (a.type === 'setOracle') {
      P({kind:'CALL', node:A, edges:[`${A}>vault`,'vault>setOracle'], code:['function setOracle',1], title:`${nm} → setOracle(0xEvil…)`, why:'Trying to swap the price source.'});
      revert('setOracle', 'onlyOwner → reverts "!owner"', `Good: ${nm} is not the owner, so access control holds. (A compromised owner key could still do this instantly — no timelock.)`, ['modifier onlyOwner',4]);
    }
    if (a.type === 'flashLoan') {
      if (s['usdc.aave'] < a.amount) return revert('aave', 'Aave has insufficient liquidity', 'Flash loan reverts.');
      P({kind:'FLASHLOAN', node:'aave', edges:[`${A}>aave`], title:`${nm} → Aave.flashLoan(${fm(a.amount)} USDC)`, transfer:{from:'aave', to:A, amt:a.amount},
         why:'Free capital for one transaction. Must be repaid + 0.09% before the transaction ends.'});
      s['usdc.aave'] -= a.amount; s['usdc.'+A] += a.amount; loans[A] = (loans[A] || 0) + Math.round(a.amount * 1.0009);
    }
    if (a.type === 'swapIn') {
      if (s['usdc.'+A] < a.amount) return revert('pool', `swap reverts — ${nm} only has ${fm(s['usdc.'+A])} USDC`, 'Insufficient input balance.');
      const p0 = priceOf(s), out = s['weth.pool'] * a.amount * .997 / (s['usdc.pool'] + a.amount * .997);
      s['usdc.'+A] -= a.amount; s['usdc.pool'] += a.amount; s['weth.pool'] -= out; s['weth.'+A] += out; const p1 = priceOf(s); s.price = p1;
      P({kind:'SWAP', node:'pool', edges:[`${A}>pool`], flag: Math.abs(p1/p0 - 1) > .05 ? 'warn' : undefined, title:`${nm} swaps ${fm(a.amount)} USDC → ${out.toFixed(1)} WETH`,
         transfer:{from:A, to:'pool', amt:a.amount}, set:{['weth.'+A]:s['weth.'+A], 'weth.pool':s['weth.pool'], price:p1},
         why:`Constant-product AMM: reserves skew and the spot price LuoraVault reads moves $${p0.toFixed(2)} → $${p1.toFixed(2)}.`});
    }
    if (a.type === 'swapOut') {
      const w = s['weth.'+A];
      if (w <= 0) return revert('pool', `${nm} has no WETH to sell`, 'Nothing to swap.');
      const p0 = priceOf(s), out = Math.round(s['usdc.pool'] * w * .997 / (s['weth.pool'] + w * .997));
      s['weth.'+A] = 0; s['weth.pool'] += w; s['usdc.pool'] -= out; s['usdc.'+A] += out; const p1 = priceOf(s); s.price = p1;
      P({kind:'SWAP', node:'pool', edges:[`${A}>pool`], title:`${nm} swaps ${w.toFixed(1)} WETH → ${fm(out)} USDC`,
         transfer:{from:'pool', to:A, amt:out}, set:{['weth.'+A]:0, 'weth.pool':s['weth.pool'], price:p1}, why:`Price moves back $${p0.toFixed(2)} → $${p1.toFixed(2)}. Round-trip slippage + 0.3% fees are the cost of the attack.`});
    }
    if (a.type === 'repay') {
      const owed = loans[A] || 0;
      if (!owed) return revert('aave', `${nm} has no open flash loan`, 'Nothing to repay.');
      if (s['usdc.'+A] < owed) return revert('aave', `Repay fails — needs ${fm(owed)}, has ${fm(s['usdc.'+A])}`, 'Flash loan not repaid → the ENTIRE transaction reverts. The attack is unprofitable as wired.');
      P({kind:'REPAY', node:'aave', edges:[`${A}>aave`], title:`${nm} repays Aave ${fm(owed)} USDC`, transfer:{from:A, to:'aave', amt:owed}, why:'Principal + 0.09% fee. Flash loan closed; the transaction succeeds.'});

}

function show(k){ (binds[k]||[]).forEach(el => el.textContent = fmt(k, S[k])); }

// ================= coins =================
const bubble = $('bubble');
const flights = [], trails = new THREE.Group(); scene.add(trails);
let speed = 1;

const coinArc = (from, to) => arc(topOf(from), topOf(to), 3 + topOf(from).distanceTo(topOf(to)) * .22);
function fly(from, to, amount, tag){
  return new Promise(res => {
    const n = Math.min(6, Math.max(3, Math.round(Math.log10(amount)))), per = Math.floor(amount / n);
    const coins = Array.from({length:n}, (_, i) => { const g = grp(coin(.42)); g.children[0].rotation.x = Math.PI/2; g.visible = false; scene.add(g);
      return {g, delay: i*700/speed, amt: i === n-1 ? amount - per*(n-1) : per}; });

}
const hop = id => obj[id].userData.hopAt = performance.now();

const clock = new THREE.Clock(), proj = V();
renderer.setAnimationLoop(now => {

    controls.target.lerpVectors(camAnim.ft, camAnim.tt, e); cam.position.lerpVectors(camAnim.fp, camAnim.tp, e); if (k === 1) camAnim = null; }
  NODES.forEach(n => {

    u.cur += ((u.on && now >= (u.popAt || 0) ? 1 : 0) - u.cur) * .14; g.scale.setScalar(Math.max(.001, u.cur));
    if (!u.on && u.cur < .01) g.visible = false;

    u.model.position.y = .38 + (u.active ? .25 + Math.sin(t*3.2)*.12 : 0) + (hopK > 0 ? Math.sin((1-hopK)*Math.PI) * .45 : 0);
    g.traverse(o => {
      if (o.userData.spin) o.rotation.z += o.userData.spin * .016;
      if (o.userData.spinY) o.rotation.y += o.userData.spinY * .016;
      if (o.userData.ring) { o.material.opacity = u.active || u.sel ? .95 : .45; o.material.color.set(u.bad ? BAD : u.c); o.scale.setScalar(u.active ? 1 + Math.sin(t*4)*.03 : 1); }
      if (o.userData.needle) o.rotation.z += ((Math.PI/2 - (S.price - .5) / 2.5 * Math.PI) - o.rotation.z) * .08;
      if (o.userData.press) o.position.y = 1.45 + Math.abs(Math.sin(t*2.6)) * -.3;
      if (o.userData.led !== undefined) o.material.emissiveIntensity = (Math.sin(t*5 + o.userData.led*1.7) > (u.active ? -.5 : .4)) ? 2.4 : .3;
      if (o.userData.blink) o.material.emissiveIntensity = Math.sin(t*4) > 0 ? 3 : .4;
      if (o.userData.smoke !== undefined) { const k = (t*.4 + o.userData.smoke/4) % 1; o.position.set(.55 + k*.3, 2.7 + k*1.4, -.35); o.scale.setScalar(.6 + k*1.6); o.material.opacity = .45*(1-k); }
    });
    if (u.model.userData.liquid) { const {u: lu, w} = u.model.userData.liquid, hu = .12 + .55 * Math.min(1.4, S['usdc.pool'] / 1e6) / 1.4, hw = .12 + .55 * Math.min(1.4, S['weth.pool'] / 400) / 1.4;
      lu.scale.y += (hu - lu.scale.y) * .08; lu.position.y = .8 + lu.scale.y/2 - .3; w.scale.y += (hw - w.scale.y) * .08; w.position.y = .8 + w.scale.y/2 - .3; }
  });

    if (done) { f.coins.forEach(c => scene.remove(c.g)); flights.splice(i, 1); bubble.style.opacity = 0; f.res(); }
  }
  Object.values(edgeObjs).forEach(e => e.pulses.forEach((p, k) => { p.visible = e.on; if (e.on) p.position.copy(e.curve.getPoint((t*.5 + k/3) % 1)); }));
  controls.update();
  renderer.render(scene, cam);
  css.render(scene, cam);
});

// ================= editor model =================
let placed = new Set(), actions = [], steps = [], endState = {...BASE}, selected = null, scenName = 'Untitled scenario';
const bps = new Set(), comments = [];
const TEMPLATES = {
  deposit:  {name:'Deposit 1,000 USDC', actors:['alice'], acts:[{type:'deposit', actor:'alice', target:'deposit', amount:1000}]},
  withdraw: {name:'Deposit → withdraw', actors:['alice'], acts:[{type:'deposit', actor:'alice', target:'deposit', amount:1000},{type:'withdraw', actor:'alice', target:'withdraw', amount:1000}]},
  harvest:  {name:'Anyone can harvest', actors:['alice'], acts:[{type:'harvest', actor:'alice', target:'harvest'}]},
  exploit:  {name:'⚠ Oracle manipulation', actors:['attacker','bob'], acts:[
    {type:'flashLoan', actor:'attacker', target:'aave', amount:500000},{type:'swapIn', actor:'attacker', target:'pool', amount:500000},
    {type:'withdraw', actor:'attacker', target:'withdraw', amount:10000},{type:'swapOut', actor:'attacker', target:'pool'},{type:'repay', actor:'attacker', target:'aave'}]},
};

function rebuild({refit = false} = {}){
  gen++; playing = false; busy = false; cur = -1; lastBreak = -1;
  flights.splice(0).forEach(f => f.coins.forEach(c => scene.remove(c.g))); bubble.style.opacity = 0; clearGroup(trails); transferN = 0;
  ({steps, end: endState} = compile(actions));
  S = {...BASE}; INIT = {...S}; Object.keys(S).forEach(show);
  const ids = new Set(NODES.filter(n => !n.actor).map(n => n.id)); placed.forEach(a => ids.add(a));
  const changed = [...ids].sort().join() !== [...visible].sort().join();
  layout(ids); drawEdges(); drawArrows();
  if (refit || changed) fit();
  activate(null); markCode(); renderTimeline(); renderLayers(); renderAssets(); renderInspector(); narrate();
  $('fileScen').textContent = scenName; $('run').textContent = '▶ Run';
}

// ---------- tools ----------
let tool = 'select', connectFrom = null;
const HINTS = {select:'<b>Select</b> · click an asset to inspect it and jump to its code',
  hand:'<b>Hand</b> · drag to orbit, scroll to zoom',
  connect:'<b>Connect</b> · click an actor, then a function, the pool or Aave',
  breakpoint:'<b>Breakpoint</b> · click an asset — the simulation pauses when execution reaches it',
  comment:'<b>Comment</b> · click an asset to leave a note for your team'};
function setTool(t){
  tool = t; connectFrom = null; closePop(); NODES.forEach(n => obj[n.id].userData.lab.classList.remove('from'));
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  vp.classList.toggle('connect', t === 'connect');
  $('hint').innerHTML = HINTS[t];
}
$('tools').onclick = e => { const t = e.target.closest('button')?.dataset.tool; if (t) setTool(t); };
addEventListener('keydown', e => {
  if (e.target.matches?.('input,textarea')) return;
  const m = {v:'select', h:'hand', c:'connect', b:'breakpoint', k:'comment'}[e.key.toLowerCase()];
  if (m) setTool(m);
  if (e.key === 'Escape') { setTool('select'); select(null); }
  if (e.key === ' ') { e.preventDefault(); play(); }
});

// picking on the canvas
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hovered = null, downAt = null;
function pick(e){ const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc, cam);
  return ray.intersectObjects(pickables.filter(m => obj[m.userData.id].userData.on), false)[0]?.object.userData.id; }
renderer.domElement.addEventListener('pointermove', e => { if (tool === 'hand') return; const h = pick(e);
  if (h === hovered) return;
  if (hovered && !obj[hovered].userData.lab.classList.contains('active')) obj[hovered].userData.lab.classList.remove('open');
  hovered = h; if (h) obj[h].userData.lab.classList.add('open'); renderer.domElement.style.cursor = h ? 'pointer' : ''; });
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 5 || tool === 'hand') return downAt = null;
  downAt = null; const id = pick(e);
  if (id) onAssetClick(id, e); else { closePop(); if (tool === 'select') select(null); }
});

function onAssetClick(id, e){
  const r = vp.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (tool === 'select' || tool === 'hand') return select(id);
  if (tool === 'breakpoint') { bps.has(id) ? bps.delete(id) : bps.add(id); drawMarkers(); renderLayers(); renderTimeline(); return; }
  if (tool === 'comment') return openComment(id, x, y);
  if (tool === 'connect') {
    if (!connectFrom) {
      if (!byId[id].actor) { $('hint').innerHTML = '<b>Connect</b> · start from an <b>actor</b> (drag one in from Assets if none is placed)'; return; }
      connectFrom = id; obj[id].userData.lab.classList.add('from');
      $('hint').innerHTML = `<b>Connect</b> · ${NM(id)} → now click a target (function, pool or Aave)`; return;
    }
    openConnect(connectFrom, id, x, y);
  }
}

// ---------- popovers ----------
const pop = $('pop');
function placePop(x, y){ pop.classList.add('on'); pop.style.left = Math.min(x + 12, vp.clientWidth - 290) + 'px'; pop.style.top = Math.min(y + 12, vp.clientHeight - pop.offsetHeight - 12) + 'px'; }
function closePop(){ pop.classList.remove('on'); }
function openConnect(actor, target, x, y){
  const opts = Object.entries(ACT).filter(([, d]) => d.target.includes(target));
  const def = type => type === 'withdraw' ? Math.max(1, Math.round(endState['shares.'+actor] || 1000)) : ACT[type].def;
  pop.innerHTML = `<h4>${NM(actor)} → ${NM(target)} <span>· add step</span></h4>` + (opts.length
    ? opts.map(([k, d], i) => `<div class="opt${i ? '' : ' on'}" data-k="${k}"><code>${d.fn}()</code><small>${d.arg || ''}</small></div>`).join('') +
      `<input id="amt" placeholder="amount"><div class="acts"><button class="pill sm" id="pc">Cancel</button><button class="pill dark sm" id="pa">Add step</button></div>`
    : `<div class="none">${NM(target)} isn't callable by an external account (internal/view or storage). Try a function, the pool or Aave.</div><div class="acts"><button class="pill sm" id="pc">OK</button></div>`);
  let sel = opts[0]?.[0];
  const amt = pop.querySelector('#amt');
  const sync = () => { if (!amt) return; const d = ACT[sel]; amt.style.display = d.arg && d.def !== undefined ? '' : 'none'; amt.value = def(sel) ?? ''; amt.placeholder = d.unit || ''; };
  sync();
  pop.querySelectorAll('.opt').forEach(o => o.onclick = () => { pop.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); o.classList.add('on'); sel = o.dataset.k; sync(); });
  pop.querySelector('#pc').onclick = () => { closePop(); setTool('connect'); };
  const add = pop.querySelector('#pa');
  if (add) add.onclick = () => {
    const d = ACT[sel], a = {type:sel, actor, target};
    if (d.arg && d.def !== undefined) { a.amount = Math.max(1, Math.round(+String(amt.value).replace(/[^\d.]/g,'') || def(sel))); }
    actions.push(a); scenName = scenName === 'Untitled scenario' || TEMPLATES[scenName] ? 'Custom scenario' : scenName;
    closePop(); setTool('connect'); rebuild();
  };
  placePop(x, y); amt?.focus();
}
function openComment(id, x, y){
  pop.innerHTML = `<h4>Comment on ${NM(id)}</h4><textarea id="ct" rows="3" placeholder="e.g. check rounding here…"></textarea>
    <div class="acts"><button class="pill sm" id="pc">Cancel</button><button class="pill dark sm" id="pa">Post</button></div>`;
  pop.querySelector('#pc').onclick = closePop;
  pop.querySelector('#pa').onclick = () => { const t = pop.querySelector('#ct').value.trim(); if (t) { comments.push({id, who:'You', av:'Y', pc:'#7c6cff', text:t}); drawMarkers(); renderLayers(); } closePop(); };
  placePop(x, y); pop.querySelector('#ct').focus();
}

// ---------- markers: breakpoints + comment pins (CSS2D on assets) ----------
const markers = [];
function drawMarkers(){
  markers.splice(0).forEach(([g, o]) => g.remove(o));
  bps.forEach(id => { const el = document.createElement('div'); el.innerHTML = '<div class="bp">● breakpoint</div>';
    const o = new CSS2DObject(el); o.position.set(0, obj[id].userData.top + 3.4, 0); obj[id].add(o); markers.push([obj[id], o]); });
  const per = {};
  comments.forEach(c => { const k = per[c.id] = (per[c.id] || 0) + 1;
    const el = document.createElement('div');
    el.innerHTML = `<div class="pin" style="--pc:${c.pc}"><div class="a">${c.av}</div><div class="t"><b>${c.who}</b>${esc(c.text)}</div></div>`;
    const o = new CSS2DObject(el); o.position.set(1.9 + (k-1)*.9, obj[c.id].userData.top * .6, .6); obj[c.id].add(o); markers.push([obj[c.id], o]); });
}

// ---------- selection + inspector ----------
function select(id){
  if (selected) { obj[selected].userData.sel = false; obj[selected].userData.lab.classList.remove('sel'); }
  selected = id;
  if (id) { obj[id].userData.sel = true; obj[id].userData.lab.classList.add('sel'); if (byId[id].find) markCode([byId[id].find, 1], 'peek'); }
  renderInspector(); renderLayers();
}
function renderInspector(){
  const I = $('insp');
  if (!selected) { I.innerHTML = `<div class="empty"><b style="color:var(--ink)">Inspector</b><br>Select an asset on the canvas or in Layers. Drag actors in from <b>Assets</b>, then wire steps with <b>Connect (C)</b>.</div>`; return; }
  const n = byId[selected], c = colorOf(n);
  I.innerHTML = `<h3 style="--c:${c}"><i></i>${n.title}<small>${KIND[n.kind][1]}</small></h3><div class="props">${rowsHtml(n)}</div>
    <div class="ibtns">${n.find ? '<button class="pill sm" id="ic">View code</button>' : ''}<button class="pill sm" id="ib">${bps.has(selected) ? '✕ Remove breakpoint' : '● Breakpoint'}</button>
    ${n.actor ? '<button class="pill sm" id="ix">⤳ Connect from here</button>' : ''}</div>`;
  registerBinds(I);
  $('ic') && ($('ic').onclick = () => markCode([n.find, 1], 'peek'));
  $('ib').onclick = () => { bps.has(selected) ? bps.delete(selected) : bps.add(selected); drawMarkers(); renderInspector(); renderLayers(); renderTimeline(); };
  $('ix') && ($('ix').onclick = () => { setTool('connect'); connectFrom = selected; obj[selected].userData.lab.classList.add('from'); $('hint').innerHTML = `<b>Connect</b> · ${NM(selected)} → now click a target`; });
}

// ---------- layers + assets panels ----------
document.querySelector('.tabs').onclick = e => { const t = e.target.dataset.tab; if (!t) return;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('layers').hidden = t !== 'layers'; $('assets').hidden = t !== 'assets'; };
function renderLayers(){
  const it = (id, cls = '') => { const n = byId[id];
    return `<div class="item ${cls} ${selected === id ? 'sel' : ''}" data-id="${id}" style="--c:${colorOf(n)}"><i></i>${n.title}${bps.has(id) ? '<span class="bpdot" title="breakpoint"></span>' : ''}<small>${KIND[n.kind][1]}</small>${n.actor ? `<button class="x" data-rm="${id}" title="Remove actor">✕</button>` : ''}</div>`; };
  $('layers').innerHTML =
    `<div class="sec">Actors <span>${placed.size}</span></div>` + ([...placed].map(id => it(id)).join('') || `<div class="tip">No actors yet — open <b>Assets</b> and drag one onto the canvas.</div>`) +
    `<div class="sec">Contract</div>` + it('vault') + ['deposit','withdraw','harvest','setOracle','_computeShares','_price','_accrueFee','storage'].map(id => it(id,'sub')).join('') +
    `<div class="sec">Dependencies</div>` + ['usdc','oracle','pool','strategy','aave'].map(id => it(id)).join('') +
    `<div class="sec">Templates</div>` + Object.entries(TEMPLATES).map(([k,t]) => `<div class="item" data-tpl="${k}" style="--c:var(--accent)"><i></i>${t.name}<small>${t.acts.length} steps</small></div>`).join('') +
    `<div class="sec">Comments <span>${comments.length}</span></div>` + comments.map(c => `<div class="item" data-id="${c.id}" style="--c:${c.pc}"><i></i>${c.who}: ${esc(c.text).slice(0,26)}…<small>${NM(c.id)}</small></div>`).join('');
}
$('layers').onclick = e => {
  const rm = e.target.dataset.rm; if (rm) { placed.delete(rm); actions = actions.filter(a => a.actor !== rm); if (selected === rm) selected = null; return rebuild(); }
  const tp = e.target.closest('[data-tpl]')?.dataset.tpl; if (tp) return loadTemplate(tp);
  const id = e.target.closest('[data-id]')?.dataset.id; if (id) select(id);
};
function renderAssets(){
  $('assets').innerHTML = `<div class="sec">Actors</div>` + Object.entries(ACTORS).map(([id,a]) =>
    `<div class="asset ${placed.has(id) ? 'placed' : ''}" draggable="${!placed.has(id)}" data-actor="${id}" style="--c:${a.c}"><div class="av">${a.icon}</div><div><b>${a.title} · ${a.role}</b><span>${a.blurb} · ${fm(a.usdc)} USDC${a.shares ? ' · ' + fm(a.shares) + ' shares' : ''}</span></div></div>`).join('') +
    `<div class="tip">Drag an actor onto the canvas (or click it). Then use <b>Connect (C)</b>: click the actor, then a function, the pool or Aave to add a step.</div>`;
  $('assets').querySelectorAll('.asset').forEach(el => {
    el.ondragstart = e => { e.dataTransfer.setData('text/actor', el.dataset.actor); vp.classList.add('dragging'); };
    el.ondragend = () => vp.classList.remove('dragging');
    el.onclick = () => placeActor(el.dataset.actor);
  });
}
vp.ondragover = e => { e.preventDefault(); vp.classList.add('dragging'); };
vp.ondragleave = e => { if (e.target === vp) vp.classList.remove('dragging'); };
vp.ondrop = e => { e.preventDefault(); vp.classList.remove('dragging'); const id = e.dataTransfer.getData('text/actor'); if (id) placeActor(id); };
function placeActor(id){ if (placed.has(id)) return; placed.add(id); rebuild(); select(id); }
function loadTemplate(k){
  const T = TEMPLATES[k]; scenName = T.name; placed = new Set(T.actors); actions = T.acts.map(a => ({...a})); selected = null; rebuild({refit:true});
}

// ---------- timeline ----------
function renderTimeline(){
  const curAct = steps[cur]?.act;
  $('tmeta').textContent = `· ${actions.length} actions · ${steps.length} steps${bps.size ? ` · ${bps.size} breakpoint${bps.size>1?'s':''}` : ''}`;
  $('acts').innerHTML = actions.map((a, i) => `<div class="act ${i === curAct ? 'cur' : ''}" style="--c:${ACTORS[a.actor].c}"><i>#${i+1}</i><span class="who"></span>${NM(a.actor)} → <code>${actLabel(a)}</code><button data-del="${i}" title="Remove step">✕</button></div>`).join('') +
    `<div class="add">${placed.size ? '+ add step: press <b>C</b>, click an actor, then a target' : '+ drag an actor from Assets, or pick a Template in Layers'}</div>`;
  $('strip').innerHTML = steps.map((s, i) => `<span class="sg ${i < cur ? 'done' : ''} ${i === cur ? 'cur done' : ''} ${s.flag || ''} ${bps.has(s.node) ? 'bpk' : ''}" title="${esc(s.title)}">${s.kind}</span>`).join('');
  $('strip').querySelector('.cur')?.scrollIntoView({block:'nearest', inline:'center'});
}
$('acts').onclick = e => { const d = e.target.dataset.del; if (d != null) { actions.splice(+d, 1); rebuild(); } };

// ================= runner =================
let cur = -1, playing = false, busy = false, transferN = 0, gen = 0, lastBreak = -1;
const sleep = ms => new Promise(r => setTimeout(r, ms / speed));
function activate(s){
  NODES.forEach(n => { const u = obj[n.id].userData; u.active = false; u.bad = false; u.lab.classList.remove('active','bad'); if (n.id !== hovered) u.lab.classList.remove('open'); });
  Object.values(edgeObjs).forEach(e => { e.on = false; e.tube.material.color.set('#343a4f'); e.el.classList.remove('on'); });
  if (!s) return;
  const u = obj[s.node].userData; u.active = true; u.bad = s.flag === 'bad';
  u.lab.classList.add('active', 'open'); if (u.bad) u.lab.classList.add('bad');
  (s.edges||[]).forEach(id => { const e = edgeObjs[id]; if (e) { e.on = true; e.tube.material.color.set('#cfd3e6'); e.el.classList.add('on'); } });
}
function narrate(s, diffs = [], pause = false){
  const N = $('narr'); N.className = 'ai';
  if (!s) { N.innerHTML = `<b class="h">✦ Luora AI</b>${steps.length
      ? `${actions.length} actions compiled into ${steps.length} EVM-level steps. Press <b>Run</b> (space) or <b>Step</b>. Breakpoints pause execution on an asset.`
      : 'Build a scenario: drag actors in from <b>Assets</b>, wire them to functions with <b>Connect (C)</b>, or load a <b>Template</b> from Layers.'}`; return; }
  if (pause) { N.classList.add('pause'); N.innerHTML = `<b class="h">⏸ Breakpoint · ${NM(s.node)}</b><h4>Next: ${s.title}</h4>Execution paused before this step. Inspect balances on the canvas, then <b>Step</b> or <b>Run</b> to continue.`; return; }
  if (s.flag) N.classList.add(s.flag);
  N.innerHTML = `<b class="h">✦ Luora AI${s.flag==='bad'?' · vulnerability':s.flag==='warn'?' · watch out':''}</b><h4>${s.title}</h4><div class="sub">${s.kind}${s.code ? ' · L' + (lineOf(s.code[0])+1) : ''} · action #${s.act+1}</div>${s.why}
    <div class="chips">${diffs.map(([k,a,b]) => `<span class="chip ${b>a?'up':'down'}">${k}: ${fmt(k,a)} → ${fmt(k,b)}</span>`).join('')}</div>`;
}
function finish(){
  const val = (k, s) => s['usdc.'+k] + s['weth.'+k] * 2500 + s['shares.'+k]; // fair value: 1 share ≈ 1 USDC, 1 WETH ≈ 2,500 USDC
  const rows = [...placed].map(id => [NM(id), val(id, S) - val(id, INIT)]);
  rows.push(['LuoraVault USDC', S['usdc.vault'] - INIT['usdc.vault']]);
  const backing = S.totalShares ? S['usdc.vault'] / S.totalShares : 1, thief = rows.find(([, d], i) => i < placed.size && d > 100);
  const bad = backing < .97 && thief;
  const N = $('narr'); N.className = 'ai' + (bad ? ' bad' : '');
  N.innerHTML = `<b class="h">✦ Luora AI · verdict</b><h4>${bad ? `Exploit: ${thief[0]} extracted ${fm(thief[1])} USDC of value` : 'Simulation complete'}</h4>
    Each vault share is now backed by <b>${backing.toFixed(3)} USDC</b>${backing < .97 ? ' — remaining depositors lost value' : ''}.
    <table class="bc">${rows.filter(([, d]) => Math.round(d)).map(([n,d]) => `<tr><td>${n}</td><td class="${d>0?'pos':'neg'}">${d>0?'+':'−'}${fm(Math.abs(d))}</td></tr>`).join('')}</table>`;
  activate(null); playing = false; $('run').textContent = '↻ Run again'; renderTimeline();
}
async function step(){
  const g = gen;
  if (busy || cur >= steps.length - 1) return false;
  const nx = steps[cur + 1];
  if (bps.has(nx.node) && lastBreak !== cur + 1) { // breakpoint: stop before executing
    lastBreak = cur + 1; playing = false; $('run').textContent = '▶ Resume';
    activate(nx); markCode(nx.code, 'cur'); narrate(nx, [], true); return false;
  }
  busy = true; cur++;
  const s = steps[cur], before = {...S};
  renderTimeline(); activate(s); markCode(s.code, 'cur', s.flag === 'bad'); narrate(s);
  if (s.transfer) {
    const {from, to, amt} = s.transfer, n = ++transferN, curve = coinArc(from, to);
    trails.children.forEach(o => o.material && (o.material.opacity = .25));
    const tr = new THREE.Mesh(new THREE.TubeGeometry(curve, 60, .04, 6), new THREE.MeshBasicMaterial({color:'#3d8ee6', transparent:true, opacity:.8}));
    const el = document.createElement('div'); el.className = 'mlab'; el.textContent = `[${n}] ${fm(amt)} USDC`;
    const lo = new CSS2DObject(el); lo.position.copy(curve.getPoint(.5)).add(V(0,.5,0));
    trails.add(tr, lo);
    await fly(from, to, amt, `[${n}]`);
    if (g !== gen) return false;
  }
  await sleep(s.transfer ? 250 : 700); if (g !== gen) return false;
  Object.entries(s.set||{}).forEach(([k,v]) => setVal(k, v));
  narrate(s, Object.keys(S).filter(k => Math.round(S[k]*100) !== Math.round(before[k]*100)).map(k => [k, before[k], S[k]]));
  await sleep(700); if (g !== gen) return false;
  busy = false;
  if (cur === steps.length - 1) { await sleep(500); if (g === gen) finish(); }
  return true;
}
async function play(){
  if (!steps.length) return;
  if (cur >= steps.length - 1) rebuild();
  playing = !playing; $('run').textContent = playing ? '❚❚ Pause' : '▶ Resume';
  const g = gen;
  while (playing && g === gen && await step()) await sleep(600);
}
$('run').onclick = play;
$('step').onclick = () => { if (playing) { playing = false; $('run').textContent = '▶ Resume'; } step(); };
$('reset').onclick = () => rebuild();
$('speed').onchange = e => speed = +e.target.value;

// ================= boot =================
// the "team" already left AI audit notes on the risky assets
comments.push({id:'_price', who:'Luora AI', av:'AI', pc:'#7c6cff', text:'F-02: spot price from a single pool — flash-loan manipulable. Use TWAP/Chainlink.'},
  {id:'withdraw', who:'Luora AI', av:'AI', pc:'#7c6cff', text:'F-01: transfer happens before the share burn (CEI).'},
  {id:'harvest', who:'Luora AI', av:'AI', pc:'#7c6cff', text:'F-06: no access control; strategy profit is trusted blindly.'});
resize(); setTool('select'); loadTemplate('exploit'); drawMarkers();
Object.assign(window, {loadTemplate, step, select, _dbg:{cam, controls, obj, actions:() => actions, steps:() => steps}});
</script>
