name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci src
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build

  contracts:
    name: Contracts · forge build, test, export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: forge build --sizes
      - name: Test (unit + invariant)
        run: forge test -vvv
      - name: Luora export smoke test
        run: node luora-export.mjs --mt test_deposit
