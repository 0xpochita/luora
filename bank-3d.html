<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const SRC = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

import {IERC20} from "./IERC20.sol";
import {IOracle} from "./IOracle.sol";
import {IStrategy} from "./IStrategy.sol";
import {IFlashReceiver} from "./IFlashReceiver.sol";

contract LuoraVault {
    address public owner;
    IERC20 public asset;
    IOracle public oracle;
    IStrategy public strategy;
    uint256 public totalShares;
    mapping(address => uint256) public shares;
    bool public paused;
    uint256 public feeBps = 50;

    event Deposit(address indexed user, uint256 assets, uint256 shares);
    event Withdraw(address indexed user, uint256 assets, uint256 shares);
    event OracleUpdated(address oldOracle, address newOracle);

    modifier onlyOwner() {
        require(msg.sender == owner, "!owner");
        _;
    }

    modifier whenNotPaused() {
        require(!paused, "paused");
        _;
    }

    constructor(IERC20 _asset, IOracle _oracle, IStrategy _strategy) {
        owner = msg.sender;
        asset = _asset;
        oracle = _oracle;
        strategy = _strategy;
    }

    receive() external payable {}

    function deposit(uint256 amount) external whenNotPaused {
        uint256 minted = _computeShares(amount);
        asset.transferFrom(msg.sender, address(this), amount);
        shares[msg.sender] += minted;
        totalShares += minted;
        emit Deposit(msg.sender, amount, minted);
    }

    function withdraw(uint256 shareAmount) external whenNotPaused {
        require(shares[msg.sender] >= shareAmount, "!shares");
        uint256 value = shareAmount * _price() / 1e18;
        (bool ok, ) = msg.sender.call{value: value}("");
        require(ok, "send failed");
        shares[msg.sender] -= shareAmount;
        totalShares -= shareAmount;
        emit Withdraw(msg.sender, value, shareAmount);
    }

    function flashLoan(uint256 amount, IFlashReceiver receiver, bytes calldata data) external {
        uint256 before = asset.balanceOf(address(this));
        asset.transfer(address(receiver), amount);
        receiver.onFlashLoan(msg.sender, amount, data);
        require(asset.balanceOf(address(this)) >= before, "!repaid");
    }

    function harvest() external {
        uint256 profit = strategy.invest(asset.balanceOf(address(this)));
        _accrueFee(profit);
    }

    function setOracle(IOracle newOracle) external onlyOwner {
        emit OracleUpdated(address(oracle), address(newOracle));
        oracle = newOracle;
    }

    function emergencyWithdraw(address to) external onlyOwner {
        _sendOut(to, asset.balanceOf(address(this)));
    }

    function _computeShares(uint256 amount) internal view returns (uint256) {
        if (totalShares == 0) return amount;
        return amount * 1e18 / _price();
    }

    function _price() internal view returns (uint256) {
        return oracle.getSpotPrice(address(asset));
    }

    function _sendOut(address to, uint256 amount) internal {
        asset.transfer(to, amount);
    }

    function _accrueFee(uint256 profit) internal {
        uint256 fee = profit * feeBps / 10_000;
        shares[owner] += fee;
        totalShares += fee;
    }
}`;

const SYSTEMS = {
  entry:{label:'Entry points',sub:'layer 1 · external functions'},
  access:{label:'Access control',sub:'gates on the entry layer'},
  logic:{label:'Internal logic',sub:'layer 2 · internal functions'},
  storage:{label:'Storage',sub:'layer 3 · state slots'},
  calls:{label:'External calls',sub:'pipes through the trust boundary'},
  deps:{label:'External contracts',sub:'outside the trust boundary'},
  events:{label:'Events',sub:'signals emitted'},
  vulns:{label:'Findings',sub:'risk markers'},
};

// find = source anchor, n = lines shown, mark = highlighted line offsets, caller = who may call (entry only)
const P = [
  // ---- layer 1: entry points (the attack surface) ----
  {id:'deposit',sys:'entry',caller:'anyone',name:'deposit()',find:'function deposit',n:7,desc:'Public entry: pulls tokens in and mints shares. Prices shares through _computeShares → _price → oracle.',links:['whenNotPaused','_computeShares','cTransferFrom','shares','totalShares','evDeposit']},
  {id:'withdraw',sys:'entry',caller:'anyone',name:'withdraw()',find:'function withdraw',n:9,mark:[3,4],desc:'Public entry: burns shares and sends value back. The external call happens before the share balance is updated (checks-effects-interactions order is not followed).',links:['whenNotPaused','_price','cCall','shares','totalShares','evWithdraw','f1','noReentrancy']},
  {id:'flashLoan',sys:'entry',caller:'anyone',name:'flashLoan()',find:'function flashLoan',n:6,desc:'Public entry: lends the vault balance within one transaction and hands control to an untrusted receiver before checking repayment.',links:['cOnFlash','cTransfer','f2']},
  {id:'harvest',sys:'entry',caller:'anyone',name:'harvest()',find:'function harvest',n:4,desc:'Public entry with no access control: moves funds into the strategy and mints a fee from the reported profit.',links:['cInvest','_accrueFee']},
  {id:'setOracle',sys:'entry',caller:'owner',name:'setOracle()',find:'function setOracle',n:4,desc:'Owner-only: replaces the price source immediately. No timelock or multisig.',links:['onlyOwner','oracle','evOracle','f4']},
  {id:'emergencyWithdraw',sys:'entry',caller:'owner',name:'emergencyWithdraw()',find:'function emergencyWithdraw',n:3,desc:'Owner-only: can move the entire token balance to any address.',links:['onlyOwner','_sendOut','f4']},
  {id:'receive',sys:'entry',caller:'anyone',name:'receive()',find:'receive()',n:1,desc:'Accepts plain ETH transfers.',links:['withdraw']},
  // ---- access gates ----
  {id:'whenNotPaused',sys:'access',name:'whenNotPaused',find:'modifier whenNotPaused',n:4,desc:'Gate on deposit/withdraw. Note: nothing in the contract ever sets paused = true, so this gate can never close.'},
  {id:'onlyOwner',sys:'access',name:'onlyOwner',find:'modifier onlyOwner',n:4,desc:'Gate for admin functions: a single externally-owned key.'},
  {id:'noReentrancy',sys:'access',name:'nonReentrant (missing)',find:'function withdraw',n:1,desc:'Missing protection, drawn as a wireframe "ghost": no reentrancy guard on any function that makes external calls.'},
  // ---- layer 2: internal logic ----
  {id:'ctor',sys:'logic',name:'constructor',find:'constructor(',n:6,desc:'Runs once at deployment: wires token, oracle and strategy; sets owner = deployer.',links:['owner','asset','oracle','strategy']},
  {id:'_computeShares',sys:'logic',name:'_computeShares()',find:'function _computeShares',n:4,mark:[1],desc:'Converts assets to shares. Mints 1:1 when totalShares is zero — first-depositor rounding edge case.',links:['_price','totalShares','f5']},
  {id:'_price',sys:'logic',name:'_price()',find:'function _price',n:3,mark:[1],desc:'Reads an instantaneous (spot) price from the oracle. Every share conversion depends on it.',links:['cPrice','f2']},
  {id:'_sendOut',sys:'logic',name:'_sendOut()',find:'function _sendOut',n:3,mark:[1],desc:'Raw token transfer; the boolean return value is not checked.',links:['cTransfer','f3']},
  {id:'_accrueFee',sys:'logic',name:'_accrueFee()',find:'function _accrueFee',n:5,desc:'Mints fee shares to the owner from the profit the strategy reports.',links:['shares','totalShares','owner']},
  // ---- layer 3: storage ----
  ...['owner','asset','oracle','strategy','totalShares','shares','paused','feeBps'].map((v,i)=>({
    id:v,sys:'storage',slot:i,name:`slot ${i} · ${v==='shares'?'shares[]':v}`,
    find:v==='shares'?'mapping(address':(' '+v+';').replace(' feeBps;',' feeBps ='),n:1,
    desc:{owner:'Admin key. Controls the oracle and emergency withdrawals.',asset:'The ERC20 token the vault accounts in.',oracle:'Price source used for every share ↔ asset conversion. Mutable by owner.',strategy:'External contract that receives funds on harvest().',totalShares:'Sum of all shares; the denominator of every conversion.',shares:'Per-user share balances (mapping). Updated after the external call in withdraw().',paused:'Read by whenNotPaused; never written.',feeBps:'Protocol fee (0.5%). No setter.'}[v]})),
  // ---- external calls (cross the trust boundary) ----
  {id:'cTransferFrom',sys:'calls',name:'asset.transferFrom',find:'asset.transferFrom',n:1,mark:[0],desc:'Pulls tokens from the caller. Return value not checked.',links:['f3']},
  {id:'cCall',sys:'calls',name:'msg.sender.call{value}',find:'msg.sender.call',n:1,mark:[0],desc:'Sends ETH by calling the caller. If the caller is a contract, its code runs here — before shares are burned.',links:['f1','receive']},
  {id:'cOnFlash',sys:'calls',name:'receiver.onFlashLoan',find:'receiver.onFlashLoan',n:1,desc:'Callback into an untrusted contract in the middle of vault execution.'},
  {id:'cInvest',sys:'calls',name:'strategy.invest',find:'strategy.invest',n:1,desc:'Sends funds to the strategy and trusts the profit it reports.'},
  {id:'cPrice',sys:'calls',name:'oracle.getSpotPrice',find:'oracle.getSpotPrice',n:1,mark:[0],desc:'The single price every share conversion depends on.',links:['oracle']},
  {id:'cTransfer',sys:'calls',name:'asset.transfer',find:'asset.transfer(to',n:1,desc:'Outgoing token transfer; return value not checked.'},
  // ---- external contracts ----
  {id:'depERC20',sys:'deps',name:'IERC20 token',find:'import {IERC20}',n:1,desc:'The token. The vault assumes standard return values; fee-on-transfer or non-returning tokens would break accounting.',links:['asset','cTransferFrom','cTransfer']},
  {id:'depOracle',sys:'deps',name:'IOracle',find:'import {IOracle}',n:1,desc:'Price feed. Fully trusted by the vault.',links:['oracle','cPrice']},
  {id:'depStrategy',sys:'deps',name:'IStrategy',find:'import {IStrategy}',n:1,desc:'Yield strategy. Fully trusted: its reported profit becomes fees.',links:['strategy','cInvest']},
  {id:'depFlash',sys:'deps',name:'IFlashReceiver',find:'import {IFlashReceiver}',n:1,desc:'Callback interface implemented by any borrower.',links:['cOnFlash']},
  {id:'depSender',sys:'deps',name:'msg.sender (caller)',find:'function withdraw',n:1,desc:'Whoever calls withdraw(). Could be a contract with its own code.',links:['cCall']},
  // ---- events ----
  {id:'evDeposit',sys:'events',name:'Deposit',find:'event Deposit',n:1,desc:'Emitted on deposit. Monitors and indexers listen here.'},
  {id:'evWithdraw',sys:'events',name:'Withdraw',find:'event Withdraw',n:1,desc:'Emitted at the end of withdraw().'},
  {id:'evOracle',sys:'events',name:'OracleUpdated',find:'event OracleUpdated',n:1,desc:'Signals a price-source change; worth alerting on.'},
  // ---- findings ----
  {id:'f1',sys:'vulns',name:'F-01 External call before state update',risk:'high',find:'(bool ok, ) =',n:5,mark:[0],desc:'withdraw() calls out before burning shares and has no reentrancy guard. Fix: update shares first (CEI) and add nonReentrant.',links:['withdraw','cCall']},
  {id:'f2',sys:'vulns',name:'F-02 Spot-price dependency',risk:'high',find:'return oracle.getSpotPrice',n:1,mark:[0],desc:'Share value comes from an instantaneous price that can move within a single transaction. Fix: use a TWAP or a robust price feed with sanity bounds.',links:['_price','flashLoan']},
  {id:'f3',sys:'vulns',name:'F-03 Unchecked ERC20 return',risk:'med',find:'asset.transfer(to',n:1,mark:[0],desc:'transfer / transferFrom return values are ignored. Fix: use SafeERC20.',links:['_sendOut','cTransferFrom']},
  {id:'f4',sys:'vulns',name:'F-04 Centralization',risk:'low',find:'function setOracle',n:1,mark:[0],desc:'One key can swap the oracle and move all funds immediately. Fix: multisig + timelock.',links:['setOracle','emergencyWithdraw']},
  {id:'f5',sys:'vulns',name:'F-05 First-deposit rounding',risk:'med',find:'if (totalShares == 0)',n:1,mark:[0],desc:'Share math is sensitive when the vault is empty. Fix: virtual shares / minimum initial deposit.',links:['_computeShares']},

const byId = Object.fromEntries(P.map(p => [p.id, p]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const LINES = SRC.split('\n');
const lineOf = a => Math.max(0, LINES.findIndex(l => l.includes(a)));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = 'pragma|solidity|import|from|contract|function|modifier|event|emit|returns|return|require|if|external|internal|public|view|payable|calldata|memory|constructor|receive|mapping|indexed';
const RE = new RegExp(`(\\/\\/.*$)|("[^"]*")|\\b(${KW})\\b|\\b(address|uint256|bool|bytes|I[A-Z]\\w*)\\b|\\b(\\d[\\d_]*(?:e\\d+)?)\\b`,'g');
const hl = l => esc(l).replace(RE,(m,c,s,k,t)=>`<span class="${c?'c':s?'s':k?'k':t?'t':'num'}">${m}</span>`);
const RISK = {high:'High', med:'Medium', low:'Low'};

// ---------- layers: a pyramid of diamonds, the outside world on top ----------
const LAYERS = [
  {key:'ext',   name:'External',  sub:'contracts it calls',   y:12.6, half:4.0, c:'ext',   sys:['deps','calls']},
  {key:'entry', name:'Entry',     sub:'external functions',   y:8.4, half:6.0, c:'entry', sys:['entry','access','events']},
  {key:'logic', name:'Logic',     sub:'internal functions',   y:4.2, half:7.6, c:'logic', sys:['logic']},
  {key:'state', name:'State',     sub:'storage slots',        y:0,  half:9.6, c:'state', sys:['storage']},
];
const layerOf = p => p.sys === 'vulns' ? layerOf(byId[LESION[p.id]]) : LAYERS.find(L => L.sys.includes(p.sys));
const LESION = {f1:'withdraw', f2:'_price', f3:'_sendOut', f4:'setOracle', f5:'_computeShares'};
const SYSCOL = s => ({entry:'entry', access:'access', logic:'logic', storage:'state', calls:'ext', deps:'ext', events:'events', vulns:'vulns'})[s];

// grid cells per layer (spacing 1.6); pieces get fixed cells, the rest become dim sockets
const CELL = 1.6;
const SPOT = {
  // external (top, small plate — full grid)
  depERC20:[-1,-1], depOracle:[1,-1], depStrategy:[1,1], depFlash:[-1,1], depSender:[0,0],
  cTransferFrom:[-2,0], cTransfer:[-1,0], cOnFlash:[0,2], cInvest:[2,0], cPrice:[0,-2], cCall:[1,0],
  // lower layers sit on the outer ring that faces the camera (outside the plate above, so nothing is hidden)
  deposit:[-3,3], whenNotPaused:[-2,3], withdraw:[-1,3], noReentrancy:[0,3], flashLoan:[1,3], receive:[2,3], harvest:[3,3],
  evDeposit:[3,2], evWithdraw:[3,1], setOracle:[3,0], onlyOwner:[3,-1], emergencyWithdraw:[3,-2], evOracle:[3,-3],
  _computeShares:[-2,4], _price:[0,4], _accrueFee:[2,4], ctor:[4,4], _sendOut:[4,1],
  owner:[-4,5], asset:[-2,5], oracle:[0,5], strategy:[2,5], totalShares:[5,3], shares:[5,1], paused:[5,-1], feeBps:[5,-3],
};

// ---------- three ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
stage.prepend(renderer.domElement);
const css2 = new CSS2DRenderer(); css2.domElement.className = 'labels'; stage.appendChild(css2.domElement);
const scene = new THREE.Scene();
const VIEW = 33;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const TARGET = V(0, 6.0, 0);
const DIRS = {iso: V(30, 22, 30), front: V(0, 14, 42), top: V(0.01, 46, 0.01)};
camera.position.copy(TARGET).add(DIRS.iso);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET); controls.enableDamping = true; controls.minZoom = .6; controls.maxZoom = 4;
scene.add(new THREE.HemisphereLight('#c9d6ff', '#0a0b0d', 1.2));
const key = new THREE.DirectionalLight('#ffffff', 1.6); key.position.set(-10, 30, 14); scene.add(key);

// faint floor grid like the reference
const grid = new THREE.GridHelper(120, 60, '#1a1d22', '#14171b'); grid.position.y = -.8; scene.add(grid);

const C = n => new THREE.Color(cssv(n));
const plates = {};
LAYERS.forEach(L => {
  const s = L.half * 2, g = new THREE.Group();
  const slab = new THREE.Mesh(new THREE.BoxGeometry(s, .28, s), new THREE.MeshStandardMaterial({color:'#1b1e23', roughness:.85, metalness:.1}));
  const inset = new THREE.Mesh(new THREE.BoxGeometry(s - 1.2, .02, s - 1.2), new THREE.MeshStandardMaterial({color:'#15181c', roughness:1}));
  inset.position.y = .15;
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(s, .28, s)), new THREE.LineBasicMaterial({color:C(L.c).multiplyScalar(.55)}));
  g.add(slab, inset, edge);
  const lab = document.createElement('div'); lab.className = 'laylab'; lab.style.setProperty('--c', cssv(L.c)); lab.textContent = `${L.name.toUpperCase()} · ${L.sub}`;
  const lo = new CSS2DObject(lab); lo.position.set(L.half - .2, .2, L.half + .3); g.add(lo);
  // dim sockets on empty cells
  const used = new Set(P.filter(p => SPOT[p.id] && layerOf(p) === L).map(p => SPOT[p.id].join()));
  const n = Math.floor((L.half - .6) / CELL);
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) if (!used.has(`${i},${j}`)) {
    const sk = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .32, 6), new THREE.MeshStandardMaterial({color:'#3a3f46', roughness:.6, metalness:.3, transparent:true, opacity:.55}));
    sk.position.set(i*CELL, .32, j*CELL); g.add(sk);
  }
  g.position.y = L.y; g.userData = {L, lab}; scene.add(g); plates[L.key] = g;
});

// nodes: grey hex prisms with a glowing cap in their layer colour
const group = {}, pickables = [];
const hexBody = new THREE.CylinderGeometry(.46, .46, .62, 6), hexCap = new THREE.CylinderGeometry(.47, .47, .1, 6);
P.forEach(p => {
  const g = new THREE.Group(), cname = SYSCOL(p.sys), cc = C(cname);
  if (p.sys === 'vulns') { // floating red diamond above the affected node
    const d = new THREE.Mesh(new THREE.OctahedronGeometry(.3), new THREE.MeshStandardMaterial({color:cc, emissive:cc, emissiveIntensity:1.4}));
    d.userData.bob = true; g.add(d);
  } else {
    const ghost = p.id === 'noReentrancy';
    const body = new THREE.Mesh(hexBody, ghost ? new THREE.MeshBasicMaterial({color:cc, wireframe:true, transparent:true, opacity:.7})
      : new THREE.MeshStandardMaterial({color:'#6b7179', roughness:.35, metalness:.55, transparent:true}));
    body.position.y = .31; g.add(body);
    if (!ghost) { const cap = new THREE.Mesh(hexCap, new THREE.MeshStandardMaterial({color:cc, emissive:cc, emissiveIntensity:.9, transparent:true})); cap.position.y = .66; g.add(cap); g.userData.cap = cap; }
    if (p.sys === 'storage' && p.id === 'shares') for (let k = 1; k < 3; k++) { const b = body.clone(); b.material = body.material.clone(); b.position.y = .31 + k*.64; g.add(b); g.userData.cap.position.y = .66 + k*.64; }
    // selection / finding ring: a diamond outline on the plate (like the reference's highlighted tile)
    const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([V(0,0,-.95),V(.95,0,0),V(0,0,.95),V(-.95,0,0)]), new THREE.LineBasicMaterial({color:cc, transparent:true, opacity:0}));
    ring.position.y = .03; g.add(ring); g.userData.ring = ring;
  }
  scene.add(g); group[p.id] = g;
  g.traverse(o => { if (o.isMesh) { o.userData.id = p.id; pickables.push(o); if (o.material.transparent) o.material.userData.base = o.material.opacity; } });
  const el = document.createElement('div'); el.className = 'chip3d ' + p.sys; el.style.setProperty('--c', cssv(cname));
  el.innerHTML = p.sys === 'vulns' ? `<i>●</i>${p.name.slice(0,4)}` : `<i>⬢</i>${p.name}`;
  const lo = new CSS2DObject(el); lo.position.y = p.sys === 'vulns' ? .5 : (p.id === 'shares' ? 2.4 : 1.25); g.add(lo); g.userData.el = el;
});

// arcs: every cross-layer relation as a dashed white arc (calls through the external layer)
const arcG = new THREE.Group(); scene.add(arcG);
const LINKS = [], seen = new Set();
P.forEach(p => (p.links||[]).forEach(t => { const k = [p.id,t].sort().join('|'); if (byId[t] && !seen.has(k)) { seen.add(k); LINKS.push([p.id,t]); } }));
const neighbours = id => { const n = new Set([id]); LINKS.forEach(([a,b]) => { if (a===id) n.add(b); if (b===id) n.add(a); }); return n; };
let arcs = [];

// ---------- state ----------
let spread = 0, selected = null, hovered = null;
const hiddenLayers = new Set();
const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
function nodePos(p){
  const L = layerOf(p), y = L.y * (1 + spread * .9);
  if (p.sys === 'vulns') { const host = byId[LESION[p.id]], [i,j] = SPOT[host.id]; return V(i*CELL, y + 2.2, j*CELL); }
  const [i,j] = SPOT[p.id] || [0,0]; return V(i*CELL, y + .14, j*CELL);
}
function layout(){
  Object.values(plates).forEach(g => { g.position.y = g.userData.L.y * (1 + spread * .9); g.visible = !hiddenLayers.has(g.userData.L.key); });
  P.forEach(p => { group[p.id].position.copy(nodePos(p)); });
  drawArcs(); refresh();
}
function drawArcs(){
  arcG.clear(); arcs = [];
  const near = selected ? neighbours(selected) : null;
  LINKS.forEach(([a,b]) => {
    const A = byId[a], B = byId[b]; if (A.sys === 'vulns' || B.sys === 'vulns') return;
    if (!visible(A) || !visible(B)) return;
    const pa = group[a].position.clone().add(V(0,.8,0)), pb = group[b].position.clone().add(V(0,.8,0));
    const same = layerOf(A) === layerOf(B);
    if (same && !(near && (near.has(a) && near.has(b) && (a === selected || b === selected)))) return; // same-layer links only when focused
    const m = pa.clone().lerp(pb, .5); m.y = Math.max(pa.y, pb.y) + 1 + pa.distanceTo(pb) * .18;
    const curve = new THREE.QuadraticBezierCurve3(pa, m, pb), pts = curve.getPoints(48);
    const hot = near && (a === selected || b === selected);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({color: hot ? C(SYSCOL(byId[a === selected ? b : a].sys)) : new THREE.Color('#ffffff'), dashSize:.22, gapSize:.18, transparent:true, opacity: hot ? 1 : (near ? .06 : .32)}));
    line.computeLineDistances(); arcG.add(line);
    if (hot || !near) { const dot = new THREE.Mesh(new THREE.SphereGeometry(hot ? .09 : .05, 10, 10), new THREE.MeshBasicMaterial({color: hot ? C(SYSCOL(byId[a === selected ? b : a].sys)) : new THREE.Color('#ffffff'), transparent:true, opacity: hot ? 1 : .6})); arcG.add(dot); arcs.push([curve, dot]); }
  });
}
const visible = p => !hiddenLayers.has(layerOf(p).key);
const ALWAYS = new Set(['vulns']);
function refresh(){
  const near = selected ? neighbours(selected) : null;
  P.forEach(p => {
    const g = group[p.id], on = visible(p), focus = p.id === selected || p.id === hovered;
    g.visible = on;
    const dim = near && !near.has(p.id);
    g.traverse(o => { if (o.isMesh && o.material.userData.base !== undefined) o.material.opacity = o.material.userData.base * (dim ? .18 : 1); });
    if (g.userData.cap) g.userData.cap.material.emissiveIntensity = dim ? .15 : focus ? 2.2 : .9;
    if (g.userData.ring) g.userData.ring.material.opacity = focus || (near && near.has(p.id)) ? 1 : P.some(f => f.sys === 'vulns' && LESION[f.id] === p.id) ? .55 : 0;
    const show = on && (focus || (near ? near.has(p.id) : ALWAYS.has(p.sys)));
    g.userData.el.classList.toggle('show', show); g.userData.el.classList.toggle('focus', focus);
  });
  Object.values(plates).forEach(g => g.traverse(o => { if (o.isMesh && o.material.transparent) o.material.opacity = near ? .25 : .55; }));
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
}

// picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev){ const r = renderer.domElement.getBoundingClientRect();
  ndc.set((ev.clientX-r.left)/r.width*2-1, -(ev.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(pickables.filter(m => group[m.userData.id].visible), false)[0]?.object.userData.id ?? null; }
renderer.domElement.addEventListener('pointermove', ev => { const h = pick(ev); if (h !== hovered) { hovered = h; refresh(); } });
let down = null;
renderer.domElement.addEventListener('pointerdown', ev => down = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => { if (down && Math.hypot(ev.clientX-down[0], ev.clientY-down[1]) < 5) select(pick(ev)); down = null; });

// camera
let camAnim = null;
function flyTo(pos, target, zoom){ camAnim = {fp:camera.position.clone(), tp:pos, ft:controls.target.clone(), tt:target.clone(), fz:camera.zoom, tz:zoom, t0:performance.now()}; }
document.getElementById('views').onclick = e => { const v = e.target.closest('button')?.dataset.cam; if (!v) return;
  if (v === 'spin') { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); return; }
  document.querySelectorAll('#views [data-cam]:not([data-cam=spin])').forEach(b => b.classList.toggle('on', b.dataset.cam === v));
  flyTo(TARGET.clone().add(DIRS[v]), TARGET, 1); };
function fit(){ const w = stage.clientWidth, h = stage.clientHeight, a = w/h; renderer.setSize(w, h); css2.setSize(w, h);
  Object.assign(camera, {left:-VIEW*a/2, right:VIEW*a/2, top:VIEW/2, bottom:-VIEW/2}); camera.updateProjectionMatrix(); }
new ResizeObserver(fit).observe(stage);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (camAnim) { const k = Math.min(1, (performance.now()-camAnim.t0)/800), s = ease(k);
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, s); controls.target.lerpVectors(camAnim.ft, camAnim.tt, s);
    camera.zoom = camAnim.fz + (camAnim.tz - camAnim.fz) * s; camera.updateProjectionMatrix(); if (k === 1) camAnim = null; }
  P.forEach((p, i) => { const g = group[p.id];
    if (p.sys === 'vulns') { g.children[0].position.y = Math.sin(t*2.4 + i) * .12; g.children[0].rotation.y = t * 1.5; }
    else if (g.userData.ring && P.some(f => f.sys === 'vulns' && LESION[f.id] === p.id) && p.id !== selected) g.userData.ring.scale.setScalar(1 + (Math.sin(t*3 + i) + 1) * .06); });
  arcs.forEach(([c, dot], i) => dot.position.copy(c.getPoint((t * .35 + i * .13) % 1)));
  controls.update(); renderer.render(scene, camera); css2.render(scene, camera);
});

// ---------- left legend ----------
function renderLegend(){
  document.getElementById('legend').innerHTML = LAYERS.map(L => { const n = P.filter(p => p.sys !== 'vulns' && layerOf(p) === L).length;
    return `<div class="lay ${hiddenLayers.has(L.key) ? 'off' : ''}" data-l="${L.key}" style="--c:var(--${L.c})"><div class="hx"><b></b></div><div class="nm">${L.name} layer</div><div class="ct">${n}</div><div class="sb">${L.sub}</div></div>`; }).join('');
}
document.getElementById('legend').onclick = e => { const k = e.target.closest('[data-l]')?.dataset.l; if (!k) return; hiddenLayers.has(k) ? hiddenLayers.delete(k) : hiddenLayers.add(k); renderLegend(); layout(); };
document.getElementById('spread').oninput = e => { spread = e.target.value / 100; document.getElementById('spv').textContent = e.target.value + '%'; layout(); };

// ---------- right panel: dashboard ↔ inspector ----------
const side = document.getElementById('side');
const findings = P.filter(p => p.sys === 'vulns');
function spark(seed, c){ // deterministic little area chart (sample data)
  const pts = Array.from({length:9}, (_, i) => 40 + Math.sin(i*1.1 + seed) * 22 + Math.cos(i*.6 + seed*2) * 12);
  const W = 230, H = 70, x = i => 22 + i * (W - 28) / 8, y = v => H - 8 - v * .7;
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i)} ${y(v)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H+8}"><defs><linearGradient id="g${seed}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${[0,1,2].map(k => `<line x1="22" x2="${W}" y1="${10 + k*22}" y2="${10 + k*22}" stroke="#2a2e35" stroke-dasharray="2 3"/>`).join('')}
    <path d="${d}L${x(8)} ${H}L${x(0)} ${H}Z" fill="url(#g${seed})"/><path d="${d}" fill="none" stroke="#e7eaee" stroke-width="1.6"/>
    ${pts.map((_, i) => i % 2 ? '' : `<text x="${x(i)}" y="${H+7}" font-size="9" fill="#5a6069" text-anchor="middle">t${i}</text>`).join('')}</svg>`;
}
function dashboard(){
  const score = findings.reduce((s, f) => s + ({high:3, med:2, low:1})[f.risk], 0), max = findings.length * 3, ratio = score / max;
  const A = (r, a) => [95 + r*Math.cos(a), 100 + r*Math.sin(a)], a0 = Math.PI*.8, a1 = Math.PI*2.2, aV = a0 + (a1 - a0) * ratio;
  const arc = (r, from, to) => { const [x0,y0] = A(r, from), [x1,y1] = A(r, to); return `M${x0} ${y0}A${r} ${r} 0 ${to - from > Math.PI ? 1 : 0} 1 ${x1} ${y1}`; };
  side.innerHTML = `
    <div class="box"><h3>Audit risk <small>SAMPLE</small></h3><div class="gauge">
      <svg viewBox="0 0 190 150"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".25"/><stop offset="1" stop-color="#ffb02e"/></linearGradient></defs>
        <path d="${arc(70, a0, a1)}" fill="none" stroke="#24282e" stroke-width="12" stroke-linecap="round"/>
        <path d="${arc(70, a0, aV)}" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round"/>
        ${Array.from({length:6}, (_, i) => { const a = a0 + (a1 - a0) * i / 5, [x,y] = A(52, a); return `<text x="${x}" y="${y+3}" font-size="9" fill="#5a6069" text-anchor="middle">${i*2}</text>`; }).join('')}
        <text x="95" y="108" text-anchor="middle" font-size="38" font-weight="300" fill="#eef0f3">${(ratio*10).toFixed(1)}</text>
        <text x="95" y="128" text-anchor="middle" font-size="11" fill="#8a9099">risk score / 10</text></svg>
      <div class="tot"><div><span>Pieces mapped</span><b>${P.filter(p => p.sys !== 'vulns').length}</b></div><div><span>Open findings</span><b style="color:var(--vulns)">${findings.length}</b></div></div></div></div>
    <div class="box"><h3>Layers <small>CALLS PER TEST · SAMPLE</small></h3>${LAYERS.map((L, i) => { const ps = P.filter(p => p.sys !== 'vulns' && layerOf(p) === L), f = findings.filter(x => layerOf(x) === L).length;
      return `<div class="lcard" style="--c:var(--${L.c});margin-bottom:10px"><div class="k"><div class="hx"></div><b>${ps.length}</b><span>${L.name} pieces</span><br><em>${f ? `▲ ${f} finding${f > 1 ? 's' : ''}` : ''}</em></div>${spark(i + 1, cssv(L.c))}</div>`; }).join('')}</div>`;
}
function inspector(p){
  const cname = SYSCOL(p.sys), s = lineOf(p.find), e = s + (p.n || 1) - 1, marks = new Set((p.mark || []).map(m => s + m));
  const fs = p.sys === 'vulns' ? [p] : findings.filter(f => (f.links || []).includes(p.id));
  const conns = [...neighbours(p.id)].filter(id => id !== p.id);
  const from = Math.max(0, s - 2), to = Math.min(LINES.length - 1, e + 2);
  side.innerHTML = `<div class="box ins" style="--c:var(--${cname})"><h3><span class="kind">${SYSTEMS[p.sys].label} · ${layerOf(p).name} layer</span><button class="x" id="back">✕</button></h3>
    <h2>${p.name}</h2><div class="badges">${p.caller ? `<span class="badge">caller: ${p.caller}</span>` : ''}${fs.map(f => `<span class="badge ${f.risk}">${f.name.slice(0,4)} · ${RISK[f.risk]}</span>`).join('')}</div>
    <p>${p.desc}</p><div class="conns">${conns.map(id => `<button class="conn" data-id="${id}" style="--c:var(--${SYSCOL(byId[id].sys)})">${byId[id].name}</button>`).join('')}</div>
    <pre class="code">${LINES.slice(from, to + 1).map((l, k) => { const i = from + k; return `<span class="cl ${marks.has(i) ? 'mk' : i >= s && i <= e ? 'hl' : ''}"><span class="n">${i+1}</span>${hl(l) || ' '}</span>`; }).join('')}</pre></div>
    <div class="ai"><div class="hd">✦ Luora AI <span>demo · mock</span></div><div class="qs"><button class="q" data-q="explain">Explain</button><button class="q" data-q="risks">What could go wrong?</button><button class="q" data-q="test">Write invariant test</button></div><div id="ans"></div></div>`;
  document.getElementById('back').onclick = () => select(null);
}
side.addEventListener('click', e => { const c = e.target.closest('.conn'); if (c) return select(c.dataset.id);
  const q = e.target.closest('.q'); if (q && selected) { const out = document.getElementById('ans'), text = aiAnswer(byId[selected], q.dataset.q); let i = 0;
    out.innerHTML = '<div class="msg"></div>'; const m = out.firstChild; const tick = () => { i += 5; m.textContent = text.slice(0, i); if (i < text.length) setTimeout(tick, 10); }; tick(); } });

// ---------- AI (mock) ----------
// ponytail: canned answers; swap aiAnswer() for a backend call that sends {piece, source, question} to Claude
const RISKS = {
  entry:['Who can call it? (anyone / owner / keeper)','Does it make external calls before updating state (CEI)?','Is there a reentrancy guard where external calls happen?','Are token return values checked (SafeERC20)?'],
  logic:['Rounding direction and divide-by-zero cases','Does it depend on a price or value that can change within one transaction?','Are inputs from external contracts validated?'],
  storage:['Who writes this slot, and in what order relative to external calls?','Can it reach an edge value (0, max) that breaks the math?'],
  calls:['What can the called contract do while it has control?','Is the return value checked?','Is the callee trusted, and why?'],
  access:['Which functions does this gate protect — and which are missing it?','Is the privileged key a multisig / behind a timelock?'],
  deps:['What does the vault assume about this contract?','What happens if it returns unexpected values or reverts?'],
  events:['Is the event emitted on every state change it describes?'],

const TESTS = {

function aiAnswer(p,q){

const tv = {x:0, y:0, k:1};

function drawTerminal(){

  for (let i = 0; i < 72; i++) { const a = i / 72 * TAU, [x1,y1] = pol(292, a), [x2,y2] = pol(i % 6 ? 297 : 286, a); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4a5058"/>`; }
  s += `<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="160s" repeatCount="indefinite"/></g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="205" fill="none" stroke="#3a3f46"/>`;
  // teal band = internal logic, one segment per internal function
  INTERNAL.forEach((id, i) => { const a0 = (i / INTERNAL.length) * TAU + .04, a1 = ((i + 1) / INTERNAL.length) * TAU - .04, on = sel && neighbours(sel).has(id);
    const [x0,y0] = pol(160, a0), [x1,y1] = pol(160, a1), [x2,y2] = pol(112, a1), [x3,y3] = pol(112, a0);

    const [lx,ly] = pol(136, (a0 + a1) / 2); s += `<text x="${lx}" y="${ly + 3}" class="tm seglab" text-anchor="middle">${byId[id].name.replace('()','')}</text>`; });
  s += `<g>`; for (let i = 0; i < 90; i++) { const a = i / 90 * TAU, [x1,y1] = pol(100, a), [x2,y2] = pol(108, a); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i % 15 ? '#2c4f52' : '#2fd3f0'}" stroke-width=".8"/>`; }
  s += `<animateTransform attributeName="transform" type="rotate" from="360 ${cx} ${cy}" to="0 ${cx} ${cy}" dur="30s" repeatCount="indefinite"/></g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="76" fill="none" stroke="#9aa0a8" stroke-width="14"/><circle cx="${cx}" cy="${cy}" r="62" fill="#050607"/>`;
  s += `<text x="${cx}" y="${cy - 2}" class="th" text-anchor="middle" style="font-size:12px">STATE</text><text x="${cx}" y="${cy + 14}" class="tm" text-anchor="middle">8 SLOTS</text>`;
  s += `<line x1="20" x2="${cx - 80}" y1="${cy}" y2="${cy}" stroke="#5a6069" stroke-dasharray="1 4"/>`;

    s += `<rect x="${x}" y="122" width="98" height="13" fill="#3a3f46"/><text x="${x + 4}" y="132" class="tm" fill="#e9edf2">${b.title}</text><text x="${x}" y="150" class="tm">${b.sub}</text>`;
    b.ids.forEach((id, ri) => { const y = 196 + ri * 26; rowPos[id] = [x, y + 8];
      const p = byId[id], hot = sel && (sel === id || neighbours(sel).has(id) || (SEQ[sel]||[]).some(([, t]) => t === id || CALL_TARGET[t] === id));
      const fill = hasFinding(id) && hot ? '#e2482f' : hot ? '#2fd3f0' : '#15181c';

    const [lx,ly] = pol(262, a); s += `<text x="${lx}" y="${ly + 3}" class="tm" text-anchor="middle" fill="${on ? '#2fd3f0' : '#8a9099'}">${byId[id].name}</text>`;
    const late = lateWrites(id);

      const col = !sel ? '#3a3f46' : sel !== id ? '#1d2126' : late[j] ? '#e2482f' : k === 'c' ? '#2fd3f0' : k === 'w' ? '#e9edf2' : '#8a9099';
      const wid = `w-${id}-${j}`, mine = sel === id;
      wires += `<path id="${wid}" d="M${px} ${py}C${cx + 330} ${py} ${end[0] - 120} ${end[1]} ${end[0]} ${end[1]}" fill="none" stroke="${col}" stroke-width="${mine ? 1.6 : 1}" class="flow ${mine ? 'fast' : ''}"/>`;
      if (mine) { // packets leave one after another in execution order; the target row and timeline step flash on arrival
        const n = SEQ[id].length, cyc = n * .7 + 1.4, t0 = j * .7 / cyc, t1 = (j * .7 + 1.2) / cyc, t2 = Math.min(1, t1 + .06), pc = late[j] ? '#e2482f' : k === 'c' ? '#2fd3f0' : '#e9edf2';
        packets += `<circle r="4" fill="${pc}"><animateMotion dur="${cyc}s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;${t0};${t1};1"><mpath href="#${wid}"/></animateMotion>
          <animate attributeName="opacity" dur="${cyc}s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;${t0};${t1};${t2};1"/></circle>`;

    }); });

  ENTRY.forEach((id, i) => { const y = ty + i * 15, late = lateWrites(id), on = sel === id;

      s += k === 'c' ? `<circle cx="${x}" cy="${y}" r="4" fill="#2fd3f0"/>` : k === 'w' ? `<rect x="${x - 3.5}" y="${y - 3.5}" width="7" height="7" fill="${late[j] ? '#e2482f' : '#e9edf2'}"/>`

    s += `<text x="1010" y="${y + 3.5}" class="tm" fill="${late.some(Boolean) ? '#ff8f7a' : on ? '#2fd3f0' : '#8a9099'}">${byId[id].name}${late.some(Boolean) ? '  ⚠ CEI' : ''}</text></g>`; });
