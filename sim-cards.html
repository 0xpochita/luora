<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luora Sec — Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e1016; --card:#161922; --ink:#e8e6f1; --muted:#8b8fa3; --line:#262a36; --soft:#1f2330; --dot:#262b3b;
  --usdc:#3d8ee6; --actor:#a78bfa; --contract:#e8e6f1; --ext:#4f8df7; --int:#14b8c4; --store:#f59e0b; --dep:#22c55e;
  --warn:#e8b339; --bad:#f0603f; --ok:#34c47c;
  --mono:'JetBrains Mono',ui-monospace,monospace; --b:2.5px solid var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}

/* pills — thick outline, like the reference button */
.pill{height:38px;padding:0 18px;border:var(--b);border-radius:999px;background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .1s,background .15s}
.pill:hover{background:var(--soft)}
.pill:active{transform:translateY(1px)}
.pill.dark,.pill.on{background:var(--ink);color:var(--bg)}
.pill.dark:hover{background:#cfcde0}
.pill.sm{height:32px;padding:0 13px;font-size:13px;border-width:2px}
select.pill{appearance:none;padding-right:14px}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:var(--b);background:var(--card);flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;margin-right:8px}
.mark{width:26px;height:26px;border:var(--b);border-radius:8px;background:conic-gradient(var(--usdc) 0 25%,var(--card) 0 50%,var(--usdc) 0 75%,var(--card) 0)}
.tag{font-size:11px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;letter-spacing:.04em}
.scen{display:flex;gap:6px;flex-wrap:wrap}
.spacer{flex:1}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(380px,31%)}
.editor{border-left:var(--b);background:#12141b;display:flex;flex-direction:column;min-height:0}
.ed-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:2px solid var(--line);font:600 13px var(--mono)}
.ed-head span{margin-left:auto;font:400 12px Inter;color:var(--muted)}
.ed-head i{width:9px;height:9px;border-radius:50%;background:var(--usdc)}
pre#code{margin:0;flex:1;overflow:auto;padding:8px 0 60px;font:12.5px/1.75 var(--mono);color:#d7d6e2}
.l{display:block;position:relative;padding-right:16px;transition:background .2s}
.ln{display:inline-block;width:46px;padding-right:14px;text-align:right;color:#4b5063;user-select:none}
.l.cur{background:rgba(232,179,57,.16);box-shadow:inset 3px 0 var(--warn)}
.l.cur.bad{background:rgba(240,96,63,.18);box-shadow:inset 3px 0 var(--bad)}
.l.peek{background:rgba(79,141,247,.16);box-shadow:inset 3px 0 var(--ext)}
.l.fd:before{content:"";position:absolute;left:7px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.k{color:#ff9b6b}.t{color:#5fd0e0}.s{color:#a7d675}.c{color:#666b7e;font-style:italic}.num{color:#f0b85a}

.right{display:grid;grid-template-rows:1fr 240px;min-height:0;min-width:0}
#viewport{position:relative;overflow:hidden;cursor:grab;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px)}
#viewport.drag{cursor:grabbing}
#graph{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#3a3f52;stroke-width:2.2;animation:fadein .5s both}
@keyframes fadein{from{opacity:0}}
.edge.on{stroke:var(--ink);stroke-width:2.6;stroke-dasharray:7 6;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-13}}
.elabel{animation:fadein .5s both;font:500 12px Inter;fill:#767b90;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.elabel.on{fill:var(--ink);font-weight:600}
.money{fill:none;stroke:var(--usdc);stroke-width:3;opacity:.45}
.money.now{opacity:1;stroke-width:3.5}
.mlabel{font:600 12px Inter;fill:var(--usdc);paint-order:stroke;stroke:var(--bg);stroke-width:6px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}

/* cards: outlined + extruded "3D" slab, tilt on hover, pop-in, lift when active */
#graph{perspective:1400px}
.node{position:absolute;width:236px;background:var(--card);border:var(--b);border-radius:16px;font:12.5px var(--mono);cursor:pointer;
  --rx:0deg;--ry:0deg;--ty:0px;--depth:6px;
  transform:perspective(900px) translateY(var(--ty)) rotateX(var(--rx)) rotateY(var(--ry));
  box-shadow:0 var(--depth) 0 color-mix(in srgb,var(--c) 55%,#07080c),0 calc(var(--depth) + 14px) 28px rgba(0,0,0,.45);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1),opacity .35s}
.node.pop{animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:perspective(900px) translateY(24px) rotateX(35deg) scale(.88)}}
.node.gone{opacity:0;pointer-events:none;transform:perspective(900px) scale(.85)}
.node:hover{--ty:-3px;--depth:9px}
.node .h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line);font:600 13px var(--mono);
  background:color-mix(in srgb,var(--c) 16%,var(--card));border-radius:13px 13px 0 0}
.node .h i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;box-shadow:0 2px 0 #07080c}
.node .h small{margin-left:auto;font:600 10px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.node.active{--ty:-10px;--depth:12px;border-color:var(--ink);box-shadow:0 var(--depth) 0 var(--c),0 26px 34px color-mix(in srgb,var(--c) 30%,transparent)}
.node.active.bad{box-shadow:0 var(--depth) 0 var(--bad),0 26px 34px rgba(226,72,47,.3)}
.node.recv{animation:recv .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes recv{40%{transform:perspective(900px) translateY(-14px) scale(1.04)}}
.row{display:flex;gap:8px;padding:7px 12px;border-top:1px solid var(--soft);position:relative;transition:background .3s}
.row:first-of-type{border-top:0}
.row .key{color:#7cb2f0;white-space:nowrap}
.row .val{margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.warn .key,.row.warn .val{color:var(--warn)}
.row.up{background:rgba(52,196,124,.16)}.row.down{background:rgba(240,96,63,.16)}
.delta{position:absolute;right:-8px;top:50%;margin-top:-11px;translate:100% 0;font:700 11px Inter;padding:1px 7px;border-radius:999px;border:2px solid var(--ink);background:var(--card);animation:rise 1.4s forwards;pointer-events:none;z-index:2}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

.bubble{position:absolute;left:0;top:0;pointer-events:none;font:700 12px Inter;color:#fff;background:var(--usdc);border:2px solid #07080c;border-radius:999px;padding:3px 10px;
  transform:translate(-50%,-160%);opacity:0;transition:opacity .2s;white-space:nowrap;z-index:3}
.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:var(--card);border:var(--b);border-radius:999px;z-index:4}
.toolbar button{width:34px;height:34px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:16px}
.toolbar button:hover{background:var(--soft)}
.legend{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:4}
.legend span{font:600 11px Inter;border:2px solid var(--ink);border-radius:999px;padding:3px 10px 3px 8px;background:var(--card);display:flex;align-items:center;gap:6px}
.legend span:before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}

/* simulation dock */
.dock{border-top:var(--b);background:var(--card);display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.15fr);min-height:0}
.steps{overflow:auto;border-right:2px solid var(--line);padding:8px}
.dock-h{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-weight:700}
.dock-h span{font-weight:500;color:var(--muted);font-size:12px;margin-left:auto}
.st{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:12.5px;color:#6d7084}
.st.done{color:var(--ink)}
.st.cur{background:var(--soft);color:var(--ink);font-weight:600}
.st b{font:600 10px var(--mono);border:2px solid currentColor;border-radius:6px;padding:1px 5px;min-width:78px;text-align:center;flex:none}
.st.bad b{color:var(--bad)}.st.warn b{color:var(--warn)}
.st .n{width:18px;text-align:right;font:500 11px var(--mono);color:#555a6c;flex:none}
.narr{overflow:auto;padding:14px 18px}
.narr h3{margin:0 0 4px;font-size:15px}
.narr .sub{color:var(--muted);font-size:12px;margin-bottom:10px;font-family:var(--mono)}
.ai{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#1b1e2a;font-size:13px}
.ai b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.ai.bad{background:rgba(240,96,63,.1);border-color:var(--bad)}.ai.bad b{color:var(--bad)}
.ai.warn{background:rgba(232,179,57,.1);border-color:var(--warn)}.ai.warn b{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:500 11.5px var(--mono);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--card)}
.chip.up{border-color:var(--ok);color:var(--ok)}.chip.down{border-color:var(--bad);color:var(--bad)}
table.bc{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
table.bc td{padding:6px 4px;border-top:1px solid var(--line)}
table.bc td:last-child{text-align:right;font:600 12.5px var(--mono)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><span class="mark"></span>Luora Sec <span class="tag">SIMULATOR</span></div>
  <nav class="scen" id="scen"></nav>
  <div class="spacer"></div>
  <select class="pill sm" id="speed" title="Speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  <button class="pill sm" id="reset">↺ Reset</button>
  <button class="pill sm" id="step">Step ›</button>

</header>

<main>
  <section class="right">
    <div id="viewport">
      <div id="graph"><svg id="edges"><g id="eg"></g><g id="mg"></g></svg></div>

      <div class="toolbar"><button id="fit" title="Fit">⤢</button><button id="zout" title="Zoom out">−</button><button id="zin" title="Zoom in">+</button></div>
    </div>

      <div class="steps">
        <div class="dock-h" id="scTitle"></div>

  </section>
  <section class="editor">
    <div class="ed-head"><i></i>LuoraVault.sol <span id="edMeta"></span></div>
    <pre id="code"></pre>
  </section>
</main>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------------- source ----------------
const SRC = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

import {IERC20} from "./IERC20.sol";
import {IOracle} from "./IOracle.sol";
import {IStrategy} from "./IStrategy.sol";

/// @title LuoraVault — USDC yield vault (sample with planted bugs)
contract LuoraVault {
    address public owner;
    IERC20 public asset;          // USDC
    IOracle public oracle;        // spot price from a DEX pool
    IStrategy public strategy;
    uint256 public totalShares;
    mapping(address => uint256) public shares;
    bool public paused;
    uint256 public feeBps = 50;

    event Deposit(address indexed user, uint256 assets, uint256 shares);
    event Withdraw(address indexed user, uint256 assets, uint256 shares);

    modifier whenNotPaused() {
        require(!paused, "paused");
        _;
    }

    modifier onlyOwner() {
        require(msg.sender == owner, "!owner");
        _;
    }

    constructor(IERC20 _asset, IOracle _oracle, IStrategy _strategy) {
        owner = msg.sender;
        asset = _asset;
        oracle = _oracle;
        strategy = _strategy;
    }

    function deposit(uint256 amount) external whenNotPaused {
        uint256 minted = _computeShares(amount);
        asset.transferFrom(msg.sender, address(this), amount);
        shares[msg.sender] += minted;
        totalShares += minted;
        emit Deposit(msg.sender, amount, minted);
    }

    function withdraw(uint256 shareAmount) external whenNotPaused {
        require(shares[msg.sender] >= shareAmount, "!shares");
        uint256 value = shareAmount * _price() / 1e18;
        asset.transfer(msg.sender, value);
        shares[msg.sender] -= shareAmount;
        totalShares -= shareAmount;
        emit Withdraw(msg.sender, value, shareAmount);
    }

    function harvest() external {
        uint256 bal = asset.balanceOf(address(this));
        asset.transfer(address(strategy), bal);
        uint256 profit = strategy.invest(bal);
        _accrueFee(profit);
    }

    function setOracle(IOracle newOracle) external onlyOwner {
        oracle = newOracle;
    }

    function _computeShares(uint256 amount) internal view returns (uint256) {
        if (totalShares == 0) return amount;
        return amount * 1e18 / _price();
    }

    function _price() internal view returns (uint256) {
        return oracle.getSpotPrice(address(asset));
    }

    function _accrueFee(uint256 profit) internal {
        uint256 fee = profit * feeBps / 10_000;
        shares[owner] += fee;
        totalShares += fee;
    }
}`;
const LINES = SRC.split('\n');
const lineOf = a => Math.max(0, LINES.findIndex(l => l.includes(a)));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = 'pragma|solidity|import|from|contract|function|modifier|event|emit|returns|return|require|if|external|internal|public|view|constructor|mapping|indexed';
const TY = 'address|uint256|bool|IERC20|IOracle|IStrategy';
const RE = new RegExp(`(\\/\\/.*$)|("[^"]*")|\\b(${KW})\\b|\\b(${TY})\\b|\\b(\\d[\\d_]*(?:e\\d+)?)\\b`,'g');
const hl = l => esc(l).replace(RE,(m,c,s,k,t)=>`<span class="${c?'c':s?'s':k?'k':t?'t':'num'}">${m}</span>`);

// static findings → red gutter dots
const FINDINGS = {'return oracle.getSpotPrice':'F-02 spot price oracle — manipulable with a flash loan',
  'asset.transferFrom':'F-03 unchecked ERC20 return value', 'asset.transfer(msg.sender':'F-01 transfer before shares are burned (CEI)',
  'if (totalShares == 0)':'F-05 first-depositor share inflation', 'function harvest':'F-06 no access control; strategy profit trusted'};
const code = document.getElementById('code');
const fdLines = new Map(Object.entries(FINDINGS).map(([a,t]) => [lineOf(a), t]));
code.innerHTML = LINES.map((l,i) => `<span class="l${fdLines.has(i)?' fd':''}" ${fdLines.has(i)?`title="${fdLines.get(i)}"`:''}><span class="ln">${i+1}</span>${hl(l)||' '}</span>`).join('');
document.getElementById('edMeta').textContent = `Solidity 0.8.20 · ${LINES.length} lines · ${fdLines.size} findings`;
const lineEls = [...code.children];
function markCode([anchor, n=1] = [], cls = 'cur', bad = false){
  lineEls.forEach(e => e.classList.remove(cls, ...(cls === 'cur' ? ['bad'] : [])));
  if (anchor == null) return;
  const s = lineOf(anchor);
  for (let i = s; i < s + n; i++) { lineEls[i].classList.add(cls); if (bad) lineEls[i].classList.add('bad'); }
  code.scrollTo({top: lineEls[s].offsetTop - code.clientHeight/3, behavior:'smooth'});
}

// ---------------- graph ----------------
const KIND = {actor:['--actor','actor'], contract:['--contract','contract'], ext:['--ext','external fn'], int:['--int','internal fn'],
  store:['--store','storage'], token:['--usdc','token'], dep:['--dep','external']};
const NODES = [
  {id:'alice', col:0, kind:'actor', title:'Alice', rows:[['type','EOA'],['USDC','@usdc.alice'],['shares','@shares.alice']]},
  {id:'attacker', col:0, kind:'actor', title:'Attacker', rows:[['type','EOA'],['USDC','@usdc.attacker'],['WETH','@weth.attacker'],['shares','@shares.attacker']]},
  {id:'vault', col:1, kind:'contract', title:'LuoraVault', find:'contract LuoraVault', rows:[['address','0x7a3f…c0de'],['USDC','@usdc.vault'],['totalShares','@totalShares'],['owner','0x0wn3…r']]},
  {id:'deposit', col:2, kind:'ext', title:'deposit()', find:'function deposit', rows:[['visibility','external'],['modifier','whenNotPaused'],['moves','user → vault']]},
  {id:'withdraw', col:2, kind:'ext', title:'withdraw()', find:'function withdraw', rows:[['visibility','external'],['modifier','whenNotPaused'],['⚠ order','transfer → burn']]},
  {id:'harvest', col:2, kind:'ext', title:'harvest()', find:'function harvest', rows:[['visibility','external'],['⚠ modifier','none'],['moves','vault → strategy']]},
  {id:'setOracle', col:2, kind:'ext', title:'setOracle()', find:'function setOracle', rows:[['visibility','external'],['modifier','onlyOwner'],['writes','oracle']]},
  {id:'_computeShares', col:3, kind:'int', title:'_computeShares()', find:'function _computeShares', rows:[['visibility','internal view'],['returns','shares to mint'],['⚠ F-05','1:1 when empty']]},
  {id:'_price', col:3, kind:'int', title:'_price()', find:'function _price', rows:[['visibility','internal view'],['source','getSpotPrice'],['⚠ F-02','spot price']]},
  {id:'_accrueFee', col:3, kind:'int', title:'_accrueFee()', find:'function _accrueFee', rows:[['visibility','internal'],['feeBps','50'],['mints to','owner']]},
  {id:'storage', col:3, kind:'store', title:'storage', find:'address public owner', rows:[['totalShares','@totalShares'],['shares[Alice]','@shares.alice'],['shares[Bob]','@shares.bob'],['shares[Attacker]','@shares.attacker'],['shares[owner]','@shares.owner'],['paused','false'],['feeBps','50']]},
  {id:'usdc', col:4, kind:'token', title:'USDC (ERC20)', rows:[['Alice','@usdc.alice'],['Vault','@usdc.vault'],['Attacker','@usdc.attacker'],['Pool','@usdc.pool'],['Strategy','@usdc.strategy'],['Aave','@usdc.aave']]},
  {id:'oracle', col:4, kind:'dep', title:'SpotOracle', rows:[['reads','Uniswap pool'],['USDC price','@price']]},
  {id:'pool', col:4, kind:'dep', title:'Uniswap USDC/WETH', rows:[['USDC reserve','@usdc.pool'],['WETH reserve','@weth.pool']]},
  {id:'strategy', col:4, kind:'dep', title:'Strategy', rows:[['USDC','@usdc.strategy'],['reports profit','@profit']]},
  {id:'aave', col:4, kind:'dep', title:'Aave (flash lender)', rows:[['USDC','@usdc.aave'],['fee','0.09%']]},
];
const EDGES = [['alice','vault','calls'],['attacker','vault','calls'],
  ['vault','deposit','external'],['vault','withdraw','external'],['vault','harvest','external'],['vault','setOracle','external'],
  ['deposit','_computeShares','calls'],['withdraw','_price','calls'],['_computeShares','_price','calls'],['harvest','_accrueFee','calls'],
  ['deposit','storage','writes'],['withdraw','storage','writes'],['_accrueFee','storage','writes'],
  ['deposit','usdc','transferFrom'],['withdraw','usdc','transfer'],['harvest','usdc','transfer'],['harvest','strategy','invest()'],
  ['_price','oracle','staticcall'],['oracle','pool','reads reserves'],['attacker','aave','flashLoan'],['attacker','pool','swap']];

const graph = document.getElementById('graph'), eg = document.getElementById('eg'), mg = document.getElementById('mg');
const nodeEl = {}, binds = {};
NODES.forEach(n => {
  const [cv, label] = KIND[n.kind];
  const d = document.createElement('div');
  d.className = 'node gone'; d.style.setProperty('--c', `var(${cv})`);
  d.innerHTML = `<div class="h"><i></i>${n.title}<small>${label}</small></div>` + n.rows.map(([k,v]) =>
    `<div class="row${k.startsWith('⚠')?' warn':''}"><span class="key">${k}:</span><span class="val" ${v[0]==='@'?`data-b="${v.slice(1)}"`:''}>${v[0]==='@'?'':v}</span></div>`).join('');
  d.querySelectorAll('[data-b]').forEach(el => (binds[el.dataset.b] ||= []).push(el));
  d.onclick = () => { if (!moved && n.find) markCode([n.find, 1], 'peek'); };
  d.onpointermove = e => { const r = d.getBoundingClientRect(); // tilt toward the cursor
    d.style.setProperty('--ry', `${((e.clientX - r.left) / r.width - .5) * 14}deg`);
    d.style.setProperty('--rx', `${-((e.clientY - r.top) / r.height - .5) * 12}deg`); };
  d.onpointerleave = () => { d.style.setProperty('--rx', '0deg'); d.style.setProperty('--ry', '0deg'); };
  graph.appendChild(d); nodeEl[n.id] = d;
});
document.getElementById('legend').innerHTML = Object.values(KIND).map(([cv,l]) => `<span style="--c:var(${cv})">${l}</span>`).join('');

const pos = {};
const box = id => { const e = nodeEl[id]; return {...pos[id], w:e.offsetWidth, h:e.offsetHeight}; };
// tidy layout: only the cards a scenario touches, stacked per column and centred
const COLW = 330, GAP = 46;
let visible = new Set(), bounds = {w:0, h:0};
function layout(ids){
  visible = ids;
  const cols = [0,1,2,3,4].map(c => NODES.filter(n => n.col === c && ids.has(n.id)));
  const hs = cols.map(c => c.reduce((h, n) => h + nodeEl[n.id].offsetHeight + GAP, -GAP));
  const H = Math.max(...hs);
  let x = 0;
  cols.forEach((c, i) => { if (!c.length) return;
    let y = (H - hs[i]) / 2;
    c.forEach(n => { pos[n.id] = {x, y}; y += nodeEl[n.id].offsetHeight + GAP; });
    x += COLW; });
  bounds = {w: x - COLW + 236, h: H};
  let k = 0;
  NODES.forEach(n => { const e = nodeEl[n.id], on = ids.has(n.id), was = !e.classList.contains('gone');
    if (on) { e.style.left = pos[n.id].x + 'px'; e.style.top = pos[n.id].y + 'px'; }
    e.classList.toggle('gone', !on);
    if (on && !was) { e.classList.remove('pop'); void e.offsetWidth; e.style.animationDelay = (k++ * 60) + 'ms'; e.classList.add('pop'); }
  });
}
const center = id => { const b = box(id); return {x:b.x + b.w/2, y:b.y + b.h/2}; };
function edgePath(a, b){
  const A = box(a), B = box(b);
  if (Math.abs(A.x - B.x) < 60) { // same column: bottom → top
    const [x1,y1,x2,y2] = A.y < B.y ? [A.x+A.w/2, A.y+A.h, B.x+B.w/2, B.y] : [A.x+A.w/2, A.y, B.x+B.w/2, B.y+B.h];
    const m = (y1+y2)/2; return [`M${x1} ${y1} C${x1} ${m} ${x2} ${m} ${x2} ${y2}`, (x1+x2)/2 + 8, m];
  }
  const x1 = A.x + A.w, y1 = A.y + Math.min(A.h/2, 40), x2 = B.x, y2 = B.y + Math.min(B.h/2, 40), m = (x1+x2)/2;
  return [`M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`, m, (y1+y2)/2 - 6];
}
function drawEdges(){
  const used = new Set(SCEN[sc].steps.flatMap(s => s.edges || []));
  eg.innerHTML = EDGES.filter(([a,b]) => used.has(`${a}>${b}`)).map(([a,b,label]) => {
    const [d, lx, ly] = edgePath(a, b);
    return `<path class="edge" data-e="${a}>${b}" d="${d}"/><text class="elabel" data-e="${a}>${b}" x="${lx}" y="${ly}" text-anchor="middle">${label}</text>`;
  }).join('');
}

const vp = document.getElementById('viewport');
const view = {k:.7, x:30, y:20};
function applyView(){
  graph.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  vp.style.backgroundSize = `${22*view.k}px ${22*view.k}px`;
  vp.style.backgroundPosition = `${view.x}px ${view.y}px`;
}
function zoomAt(f, mx = vp.clientWidth/2, my = vp.clientHeight/2){
  const k = Math.min(2.2, Math.max(.3, view.k * f));
  view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; applyView();
}
function fit(){
  const W = bounds.w + 40, H = bounds.h + 80, k = Math.min(1.1, (vp.clientWidth - 40) / W, (vp.clientHeight - 110) / H);
  view.k = k; view.x = (vp.clientWidth - bounds.w*k)/2; view.y = 60 + (vp.clientHeight - 110 - bounds.h*k)/2; applyView();
}
vp.addEventListener('wheel', e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
let drag = null, moved = false;
vp.addEventListener('pointerdown', e => { if (e.target.closest('.toolbar,.legend')) return; drag = [e.clientX, e.clientY, view.x, view.y]; moved = false; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX-drag[0], dy = e.clientY-drag[1];
  if (Math.abs(dx)+Math.abs(dy) > 4) { moved = true; vp.classList.add('drag'); } view.x = drag[2]+dx; view.y = drag[3]+dy; applyView(); });
addEventListener('pointerup', () => { drag = null; vp.classList.remove('drag'); setTimeout(() => moved = false); });
document.getElementById('fit').onclick = fit;
document.getElementById('zin').onclick = () => zoomAt(1.2);
document.getElementById('zout').onclick = () => zoomAt(1/1.2);

const fmt = (k, v) => k === 'price' ? '$' + v.toFixed(2) : v.toLocaleString('en-US', {maximumFractionDigits: k.startsWith('weth') ? 2 : 0});
function show(k){ (binds[k]||[]).forEach(el => el.textContent = fmt(k, S[k])); }
function setVal(k, v){
  const a = S[k]; S[k] = v; if (a === v) return show(k);
  (binds[k]||[]).forEach(el => {
    const row = el.parentElement, dir = v > a ? 'up' : 'down';
    row.classList.add(dir); setTimeout(() => row.classList.remove(dir), 900);
    row.insertAdjacentHTML('beforeend', `<span class="delta ${dir}">${v>a?'+':'−'}${fmt(k, Math.abs(v-a))}</span>`);
    setTimeout(() => row.querySelector('.delta')?.remove(), 1400);
    const t0 = performance.now();
    const tick = now => { const u = Math.min(1, (now - t0) / 650); el.textContent = fmt(k, a + (v - a) * (1 - Math.pow(1-u, 3))); if (u < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

function coinFace(){
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#2775ca'; x.fillRect(0,0,256,256);
  x.strokeStyle = '#fff'; x.lineWidth = 12;
  x.beginPath(); x.arc(128,128,86,Math.PI*.62,Math.PI*1.38); x.stroke();
  x.beginPath(); x.arc(128,128,86,-Math.PI*.38,Math.PI*.38); x.stroke();
  x.fillStyle = '#fff'; x.font = '700 120px Inter, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('$', 128, 136);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const faceMat = new THREE.MeshStandardMaterial({map:coinFace(), metalness:.25, roughness:.35});
const edgeMat = new THREE.MeshStandardMaterial({color:'#1b5aa3', metalness:.6, roughness:.3});
const coinGeo = new THREE.CylinderGeometry(1, 1, .2, 48);
function makeCoin(){
  const m = new THREE.Mesh(coinGeo, [edgeMat, faceMat, faceMat]); m.rotation.x = Math.PI/2;
  const g = new THREE.Group(); g.add(m); scene.add(g); return g;
}
function fxResize(){

// coin route: one clean arc sender → receiver (the USDC ledger card pulses as each coin settles)
const ctrl = (a, b) => ({x:(a.x+b.x)/2, y:Math.min(a.y, b.y) - 60 - Math.abs(a.x-b.x)*.12});
function routePoint(from, to, u){
  const a = center(from), b = center(to), c = ctrl(a, b), q = 1 - u;
  return {x:q*q*a.x + 2*q*u*c.x + u*u*b.x, y:q*q*a.y + 2*q*u*c.y + u*u*b.y};
}
function routeD(from, to){ const a = center(from), b = center(to), c = ctrl(a, b); return `M${a.x} ${a.y} Q${c.x} ${c.y} ${b.x} ${b.y}`; }
const bubble = document.getElementById('bubble');
const flights = [];
let speed = 1;
function fly(from, to, amount, tag){
  return new Promise(res => {
    const n = Math.min(6, Math.max(3, Math.round(Math.log10(amount)))), per = Math.floor(amount / n);
    const coins = Array.from({length:n}, (_, i) => ({g: makeCoin(), delay: i*700/speed, amt: i === n-1 ? amount - per*(n-1) : per}));
    flights.push({from, to, tag, n, amount, t0: performance.now(), dur: 1900/speed, coins, res});
  });
}
const toScreen = p => ({x: p.x*view.k + view.x, y: p.y*view.k + view.y});
fx.setAnimationLoop(now => {
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i]; let done = true, lead = null;
    f.coins.forEach((c, j) => {
      const u = Math.min(1, Math.max(0, (now - f.t0 - c.delay) / f.dur));
      if (u > 0 && !c.left) { c.left = true; setVal('usdc.' + f.from, S['usdc.' + f.from] - c.amt); }   // leaves sender
      if (u >= 1 && !c.landed) { c.landed = true; setVal('usdc.' + f.to, S['usdc.' + f.to] + c.amt); // lands, one by one
        [f.to, 'usdc'].forEach(id => { const e = nodeEl[id]; e.classList.remove('recv'); void e.offsetWidth; e.classList.add('recv'); }); }
      if (u < 1) { done = false; if (u > 0 && !lead) lead = [c, j]; }
      const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2, s = toScreen(routePoint(f.from, f.to, e));
      c.g.position.set(s.x, -s.y, 0); c.g.visible = u > 0 && u < 1;
      c.g.rotation.y = Math.sin(u*9 + j) * 1.05; c.g.rotation.x = Math.cos(u*7 + j) * .35; // wobble, face mostly toward viewer
      c.g.scale.setScalar(Math.max(12, 22 * view.k) * (1 + .5*Math.sin(Math.PI*u)));
    });
    if (lead) { const [c, j] = lead, sp = toScreen(routePoint(f.from, f.to, .5)), p = c.g.position;
      bubble.style.left = p.x + 'px'; bubble.style.top = -p.y + 'px'; bubble.style.opacity = 1;
      bubble.textContent = `${f.tag} coin ${j+1}/${f.n} · ${c.amt.toLocaleString('en-US')} USDC`; }
    if (done) { f.coins.forEach(c => scene.remove(c.g)); flights.splice(i, 1); bubble.style.opacity = 0; f.res(); }
  }
  fx.render(scene, cam);
});

let sc = 'deposit', cur = -1, playing = false, busy = false, transferN = 0, gen = 0;

function load(k){
  gen++; sc = k; playing = false; busy = false; cur = -1; transferN = 0;
  flights.splice(0).forEach(f => f.coins.forEach(c => scene.remove(c.g))); bubble.style.opacity = 0;

  Object.keys(S).forEach(show);
  mg.innerHTML = '';
  scenNav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === k));
  activate(null); markCode(); markCode([], 'peek');
  const ids = new Set(['vault', 'usdc']);
  SCEN[k].steps.forEach(s => { ids.add(s.node); (s.edges||[]).forEach(e => e.split('>').forEach(x => ids.add(x)));
    if (s.transfer) { ids.add(s.transfer.from); ids.add(s.transfer.to); } });
  layout(ids); drawEdges(); fit();
  renderSteps(); narrate();
  runBtn.textContent = '▶ Run simulation';
}
function renderSteps(){
  const st = SCEN[sc].steps;
  document.getElementById('scTitle').innerHTML = `${SCEN[sc].label}<span>${cur+1} / ${st.length} steps</span>`;
  document.getElementById('stepList').innerHTML = st.map((s,i) =>
    `<div class="st ${i<cur?'done':''} ${i===cur?'cur':''} ${i<=cur&&s.flag?s.flag:''}"><span class="n">${i+1}</span><b>${s.kind}</b>${s.title}</div>`).join('');
  document.querySelector('.st.cur')?.scrollIntoView({block:'nearest'});
}
function activate(s){
  Object.values(nodeEl).forEach(e => e.classList.remove('active','bad'));
  document.querySelectorAll('[data-e]').forEach(e => e.classList.remove('on'));
  if (!s) return;
  nodeEl[s.node].classList.add('active'); if (s.flag === 'bad') nodeEl[s.node].classList.add('bad');
  (s.edges||[]).forEach(id => document.querySelectorAll(`[data-e="${id}"]`).forEach(e => e.classList.add('on')));
}
function narrate(s, diffs = []){
  const N = document.getElementById('narr');

    <div class="ai"><b>✦ Luora AI</b>Each step highlights the executing code on the left, the card on the graph, and updates real balances. USDC transfers fly as 3D coins, one at a time, from sender to receiver — the USDC ledger card updates as each coin lands, and every transfer leaves a numbered trail.</div>`; return; }
  N.innerHTML = `<h3>${s.title}</h3><div class="sub">${s.kind}${s.code ? ' · L' + (lineOf(s.code[0])+1) : ''}</div>

    <div class="chips">${diffs.map(([k,a,b]) => `<span class="chip ${b>a?'up':'down'}">${k}: ${fmt(k,a)} → ${fmt(k,b)}</span>`).join('')}</div>`;
}
function finish(){
  const holders = [['Alice','usdc.alice'],['Attacker','usdc.attacker'],['LuoraVault','usdc.vault'],['Uniswap pool','usdc.pool'],['Strategy','usdc.strategy'],['Aave','usdc.aave']];
  const rows = holders.map(([n,k]) => [n, S[k]-INIT[k]]).filter(([,d]) => d);
  document.getElementById('narr').innerHTML = `<h3>Simulation complete</h3><div class="sub">balance changes · USDC</div>
    <div class="ai ${sc==='exploit'?'bad':''}"><b>✦ Luora AI · verdict</b>${SCEN[sc].verdict}</div>
    <table class="bc">${rows.map(([n,d]) => `<tr><td>${n}</td><td class="${d>0?'pos':'neg'}">${d>0?'+':'−'}${Math.abs(d).toLocaleString('en-US')}</td></tr>`).join('')}</table>`;
  activate(null); playing = false; runBtn.textContent = '↻ Run again';
}
async function step(){
  const st = SCEN[sc].steps, g = gen;
  if (busy || cur >= st.length - 1) return false;
  busy = true; cur++;
  const s = st[cur], before = {...S};
  renderSteps(); activate(s); markCode(s.code, 'cur', s.flag === 'bad'); narrate(s);
  if (s.transfer) {
    const {from, to, amt} = s.transfer, n = ++transferN, mid = routePoint(from, to, .5);
    mg.querySelectorAll('.now').forEach(e => e.classList.remove('now'));
    mg.insertAdjacentHTML('beforeend', `<path class="money now" d="${routeD(from, to)}"/><text class="mlabel" x="${mid.x}" y="${mid.y-8}" text-anchor="middle">[${n}] ${amt.toLocaleString('en-US')} USDC</text>`);
    await fly(from, to, amt, `[${n}]`);
    if (g !== gen) return false;
  }
  await sleep(s.transfer ? 250 : 500); if (g !== gen) return false;
  Object.entries(s.set||{}).forEach(([k,v]) => setVal(k, v));
  narrate(s, Object.keys(S).filter(k => S[k] !== before[k]).map(k => [k, before[k], S[k]]));
  await sleep(600); if (g !== gen) return false;
  busy = false;
  if (cur === st.length - 1) { await sleep(500); if (g === gen) finish(); }
  return true;
}
async function play(){
  if (cur >= SCEN[sc].steps.length - 1) load(sc);
  playing = !playing;
  runBtn.textContent = playing ? '❚❚ Pause' : '▶ Resume';
  const g = gen;
  while (playing && g === gen && await step()) await sleep(700);
}
runBtn.onclick = play;
document.getElementById('step').onclick = () => { if (playing) { playing = false; runBtn.textContent = '▶ Resume'; } step(); };
document.getElementById('reset').onclick = () => load(sc);
document.getElementById('speed').onchange = e => speed = +e.target.value;

// ---------------- boot ----------------
fxResize(); load('deposit');
document.fonts.ready.then(() => { layout(visible); drawEdges(); fit(); }); // card heights settle once fonts load
addEventListener('resize', fit);
Object.assign(window, {load, step}); // handy from devtools
</script>
</body>
