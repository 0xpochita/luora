<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luora · Foundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0d0f15; --panel:#13161e; --card:#191d27; --ink:#e8e6f1; --muted:#8a8ea2; --dim:#5d6276; --line:#242936; --soft:#1f2430;
  --accent:#7c6cff; --usdc:#3d8ee6; --ok:#34c47c; --warn:#e8b339; --bad:#f0603f; --proxy:#c084fc;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;overflow:hidden;display:grid;grid-template:"top top top" 48px "tests main code" 1fr / 260px 1fr 420px}
button{font:inherit;color:inherit;cursor:pointer}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.mark{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);background:conic-gradient(var(--usdc) 0 25%,#fff 0 50%,var(--usdc) 0 75%,#fff 0)}
.top .meta{margin-left:auto;display:flex;gap:8px}
.tagx{font:500 11.5px var(--mono);padding:4px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:#c7c9d6}
.tagx.ok{color:var(--ok);border-color:rgba(52,196,124,.35)}

.tests{grid-area:tests;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.sec{padding:12px 14px 6px;font:600 10.5px Inter;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ti{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font:12px var(--mono);color:#cfd1dc}
.ti:hover{background:var(--soft)}
.ti.sel{background:rgba(124,108,255,.18);color:#fff;box-shadow:inset 2px 0 var(--accent)}
.ti i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.ti i.fail{background:var(--bad)}
.ti small{margin-left:auto;color:var(--dim);font:500 10.5px Inter}
.help{margin:12px 14px;padding:10px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:11.5px}
.help code{font:11px var(--mono);color:#c7c9d6}

main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0}
.vh{display:flex;align-items:flex-end;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.vh h2{margin:0;font:600 16px var(--mono)}
.vh p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.ctl{margin-left:auto;display:flex;gap:6px}
.chipt{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:#c7c9d6;cursor:pointer;user-select:none}
.chipt.off{opacity:.4}
.body{flex:1;overflow:auto;padding:14px 18px}
.src{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;padding:9px 12px;border-radius:10px;background:rgba(52,196,124,.07);border:1px solid rgba(52,196,124,.3);font-size:12px;color:#b9e8cf}
.src code{font:12px var(--mono);color:#fff}
.src.fail{background:rgba(240,96,63,.08);border-color:rgba(240,96,63,.4);color:#ffc9bd}
.tr{font:12px var(--mono)}
.trow{display:flex;align-items:center;gap:7px;min-height:30px;padding-right:10px;border-radius:6px;white-space:nowrap;cursor:pointer}
.trow:hover{background:#171b24}
.trow.sel{background:rgba(124,108,255,.14)}
.trow.rev{background:rgba(240,96,63,.08)}
.trow .ix{width:30px;text-align:right;color:var(--dim)}
.trow .ind{width:18px;align-self:stretch;border-left:1px solid #2a2f3c;flex:none}
.ty{font:600 10px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid}
.ty.CALL{color:#7fb0ff;border-color:#2c4a7a}.ty.STATICCALL{color:#9aa0b4;border-color:#343a4c}.ty.DELEGATECALL{color:var(--proxy);border-color:#5b3f7a}.ty.EVENT{color:var(--ok);border-color:#1f5a3c}.ty.VM{color:#e8b339;border-color:#6a5420}.ty.REVERT{color:var(--bad);border-color:#7a3324}
.trow .c{color:#8fb7ff}.trow .f{color:#ff9b6b}.trow .a{color:#c7c9d6;overflow:hidden;text-overflow:ellipsis}
.trow .ret{color:#a7d675}.trow .rr{color:var(--bad)}
.trow .gas{margin-left:auto;color:var(--dim);font-size:11px;padding-left:12px}

.grid2[hidden]{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h4{margin:0 0 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:6px 4px;border-top:1px solid var(--line)}
td.n{text-align:right;font:600 12px var(--mono)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{color:var(--muted);font-size:12px}

.code{grid-area:code;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ftabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.ftabs button{border:0;background:none;padding:6px 10px;border-radius:8px 8px 0 0;font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.ftabs button.on{background:var(--card);color:var(--ink)}
.ctx{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ctx b{color:var(--ink)}
pre#srcv{margin:0;flex:1;overflow:auto;padding:6px 0 40px;font:12px/1.7 var(--mono);color:#d7d6e2}
.l{display:block;padding-right:14px}
.ln{display:inline-block;width:40px;padding-right:12px;text-align:right;color:#4b5063;user-select:none}
.l.hl{background:rgba(124,108,255,.16);box-shadow:inset 3px 0 var(--accent)}
.k{color:#ff9b6b}.t{color:#5fd0e0}.s{color:#a7d675}.cm{color:#666b7e;font-style:italic}.num{color:#f0b85a}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;margin-right:6px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:12px;color:var(--muted)}
.seg button.on{background:#262b39;color:var(--ink)}
#graphvp{position:relative;height:100%;min-height:420px;overflow:hidden;cursor:grab;border:1px solid var(--line);border-radius:12px;
  background:#101219 radial-gradient(#1f2330 1.1px,transparent 1.1px) 0 0/22px 22px}
#graphvp[hidden]{display:none}
#graphvp.drag{cursor:grabbing}
#graph{position:absolute;left:0;top:0;transform-origin:0 0}
#gedges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.gedge{fill:none;stroke:#3a4052;stroke-width:1.6}
.glab{font:500 11px Inter;fill:#7d8296;paint-order:stroke;stroke:#101219;stroke-width:5px}
.gn{position:absolute;min-width:230px;max-width:340px;background:#1b1f29;border:1px solid #2e3444;border-radius:8px;font:12px var(--mono);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.gn:hover{border-color:#4a5268}
.gn.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.25)}
.gn.rev{border-color:rgba(240,96,63,.6)}
.gn .gh{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid #2a2f3c;white-space:nowrap}
.gn .gh .c{color:#8fb7ff}.gn .gh .f{color:#ff9b6b}
.gn .gr{display:flex;gap:10px;padding:5px 10px;border-top:1px solid #232835;white-space:nowrap}
.gn .gr:first-of-type{border-top:0}
.gn .gr .k{color:#7cb2f0}.gn .gr .v{margin-left:auto;color:#e8e6f1}
.gn .gr .v.ret{color:#a7d675}.gn .gr .v.bad{color:var(--bad)}.gn .gr .v.dim{color:var(--dim)}
.gzoom{position:absolute;right:10px;bottom:10px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.gzoom button{width:28px;height:26px;border:0;border-radius:6px;background:none}
.gzoom button:hover{background:var(--soft)}
.body.gm{display:flex;flex-direction:column}
.body.gm #graphvp{flex:1}
.err{padding:40px;color:var(--muted);max-width:620px}
.err code{display:block;margin-top:10px;padding:10px;background:var(--card);border-radius:8px;font:12px var(--mono);color:var(--ink)}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><span class="mark"></span>Luora · Foundry</div>
  <div class="meta" id="meta"></div>
</header>
<aside class="tests" id="tests"></aside>
<main>
  <div class="vh"><div><h2 id="tname">—</h2><p>Decoded call trace from your local <code>forge test</code>. Click a frame to jump to its source.</p></div>
    <div class="ctl"><div class="seg" id="mode"><button class="on" data-m="trace">Trace</button><button data-m="graph">Graph</button></div><span class="chipt" data-k="VM">cheatcodes</span><span class="chipt" data-k="EVENT">events</span><span class="chipt" data-k="STATICCALL">view calls</span></div></div>
  <div class="body"><div id="banner"></div><div class="tr" id="trace"></div>
    <div id="graphvp" hidden><div id="graph"><svg id="gedges"></svg></div><div class="gzoom"><button id="gzo">−</button><button id="gzf">⤢</button><button id="gzi">+</button></div></div>
    <div class="grid2"><div class="card"><h4>Token transfers</h4><div id="xfers"></div></div><div class="card"><h4>Net balance change</h4><div id="net"></div></div></div></div>
</main>
<aside class="code"><div class="ftabs" id="ftabs"></div><div class="ctx" id="ctx">Select a frame.</div><pre id="srcv"></pre></aside>

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = 'pragma|solidity|contract|interface|function|modifier|event|emit|returns|return|require|if|for|external|internal|public|view|pure|constructor|mapping|import|is|memory|calldata|constant';
const TY = 'address|uint256|uint8|bool|string|IERC20|IOracle|IStrategy';
const RE = new RegExp(`(\\/\\/.*$)|("[^"]*")|\\b(${KW})\\b|\\b(${TY})\\b|\\b(\\d[\\d_]*(?:e\\d+)?)\\b`,'g');
const hl = l => esc(l).replace(RE,(m,c,s,k,t)=>`<span class="${c?'cm':s?'s':k?'k':t?'t':'num'}">${m}</span>`);
// 20000000000 → 20,000e6 (readable fixed-point, like Phalcon)
const human = v => { if (!/^\d+$/.test(v)) return v; const b = BigInt(v);
  for (const [d, s] of [[10n**18n,'e18'],[10n**6n,'e6']]) if (b >= d && b % (d / 100n) === 0n) { const w = Number(b * 100n / d) / 100; return w.toLocaleString('en-US') + s; }
  return Number(b).toLocaleString('en-US'); };
const prettyArgs = a => a.replace(/=(\d+)/g, (_, n) => '=' + human(n));

let D, cur = 0, curFile = null;
const hide = new Set();
fetch('luora-data.json', {cache:'no-store'}).then(r => r.json()).then(d => { D = d; boot(); })
  .catch(() => document.querySelector('main').innerHTML = `<div class="err"><h2>No luora-data.json yet</h2>Run the exporter in your Foundry project, then reload:<code>node luora-export.mjs</code></div>`);

function boot(){
  document.getElementById('meta').innerHTML = `<span class="tagx">${D.tests.length} tests</span><span class="tagx">${Object.keys(D.sources).length} source files</span><span class="tagx ok">● ${esc(D.forgeVersion)}</span>`;
  const bySuite = {};
  D.tests.forEach((t, i) => (bySuite[t.suite] ||= []).push([t, i]));
  document.getElementById('tests').innerHTML = Object.entries(bySuite).map(([s, ts]) => `<div class="sec">${esc(s)}</div>` +
    ts.map(([t, i]) => `<div class="ti" data-i="${i}"><i class="${t.status === 'Success' ? '' : 'fail'}"></i>${esc(t.name)}<small>${typeof t.kind === 'string' ? t.kind : Object.keys(t.kind)[0]}</small></div>`).join('')).join('') +
    `<div class="help">Re-run after changing tests:<br><code>node luora-export.mjs</code><br><code>node luora-export.mjs --mt test_deposit</code></div>`;
  document.getElementById('tests').onclick = e => { const el = e.target.closest('.ti'); if (el) show(+el.dataset.i); };
  document.querySelectorAll('.chipt').forEach(c => c.onclick = () => { const k = c.dataset.k; hide.has(k) ? hide.delete(k) : hide.add(k); c.classList.toggle('off'); renderTrace(); if (mode === 'graph') renderGraph(); });
  renderFile(Object.keys(D.sources)[0]);
  show(D.tests.findIndex(t => t.frames.length > 8) >= 0 ? D.tests.findIndex(t => t.frames.length > 8) : 0);
}
function show(i){
  cur = i; const t = D.tests[i];
  document.querySelectorAll('.ti').forEach(x => x.classList.toggle('sel', +x.dataset.i === i));
  document.getElementById('tname').textContent = t.name;
  const ok = t.status === 'Success';
  document.getElementById('banner').innerHTML = `<div class="src ${ok ? '' : 'fail'}">${ok ? '✓' : '✕'} <code>${esc(D.command)}</code> · ${esc(t.file)} · status <b>${esc(t.status)}</b>${t.reason ? ' · ' + esc(t.reason) : ''} · exported ${new Date(D.generatedAt).toLocaleString()}</div>`;
  renderTrace(); renderFlow(); if (mode === 'graph') { renderGraph(); gfit(); }
}
function kindOf(f){ return f.contract === 'vm' ? 'VM' : !f.ok ? 'REVERT' : f.kind; }
function renderTrace(){
  const t = D.tests[cur];
  document.getElementById('trace').innerHTML = t.frames.map((f, i) => {
    const k = kindOf(f); if (hide.has(k) || (k === 'STATICCALL' && hide.has('STATICCALL'))) return '';
    return `<div class="trow ${f.ok ? '' : 'rev'}" data-i="${i}"><span class="ix">${i}</span>${'<span class="ind"></span>'.repeat(f.d)}<span class="ty ${k}">${k}</span>
      <span class="c">${esc(f.to)}</span>.<span class="f">${esc(f.fn)}</span><span class="a">(${esc(prettyArgs(f.args))})</span>
      ${f.ret ? `<span>→</span><span class="${f.ok ? 'ret' : 'rr'}">${esc(f.ok ? prettyArgs('=' + f.ret).slice(1) : f.ret)}</span>` : ''}
      ${f.gas != null ? `<span class="gas">${f.gas.toLocaleString()}</span>` : ''}</div>`; }).join('');
}
document.getElementById('trace').onclick = e => {
  const row = e.target.closest('.trow'); if (!row) return;
  document.querySelectorAll('.trow.sel').forEach(x => x.classList.remove('sel')); row.classList.add('sel');
  openFrame(+row.dataset.i);
};
function openFrame(i){
  const f = D.tests[cur].frames[i];
  const file = f.file || Object.keys(D.sources).find(p => new RegExp(`(contract|interface)\\s+${f.contract}\\b`).test(D.sources[p]));
  if (!file || !D.sources[file]) { document.getElementById('ctx').innerHTML = `<b>${esc(f.to)}.${esc(f.fn)}</b> · no source in scope (cheatcode / library)`; return; }
  renderFile(file);
  const lines = D.sources[file].split('\n');
  let s = lines.findIndex(l => new RegExp(`(function|event|modifier)\\s+${f.fn}\\b`).test(l));
  if (s < 0) s = lines.findIndex(l => l.includes(f.fn));
  if (s < 0) s = 0;
  let end = s, depth = 0;
  for (let i = s; i < lines.length; i++) { depth += (lines[i].match(/{/g)||[]).length - (lines[i].match(/}/g)||[]).length; end = i; if (depth <= 0 && (i > s || !lines[i].includes('{'))) break; }
  const els = [...document.getElementById('srcv').children];
  for (let i = s; i <= end; i++) els[i]?.classList.add('hl');
  document.getElementById('srcv').scrollTo({top: (els[s]?.offsetTop || 0) - 80, behavior:'smooth'});
  document.getElementById('ctx').innerHTML = `<b>${esc(f.to)}.${esc(f.fn)}</b> · ${esc(file)} L${s+1}–${end+1}`;
}
function renderFile(f){
  curFile = f;
  document.getElementById('ftabs').innerHTML = Object.keys(D.sources).map(k => `<button class="${k === f ? 'on' : ''}" data-f="${esc(k)}">${esc(k.split('/').pop())}</button>`).join('');
  document.getElementById('srcv').innerHTML = D.sources[f].split('\n').map((l, i) => `<span class="l"><span class="ln">${i+1}</span>${hl(l) || ' '}</span>`).join('');
}
document.getElementById('ftabs').onclick = e => { const f = e.target.dataset.f; if (f) renderFile(f); };
// ===== Graph mode: call tree as JSON-Crack-style cards =====
let mode = 'trace';
const gvp = document.getElementById('graphvp'), graph = document.getElementById('graph'), gedges = document.getElementById('gedges');
const gv = {k:.9, x:20, y:20};
document.getElementById('mode').onclick = e => { const m = e.target.dataset.m; if (!m) return; mode = m;
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.getElementById('trace').hidden = m !== 'trace'; gvp.hidden = m !== 'graph';
  document.querySelector('.body').classList.toggle('gm', m === 'graph'); document.querySelector('.grid2').hidden = m === 'graph';
  if (m === 'graph') { renderGraph(); gfit(); } };
function rowsOf(f){
  const r = [];
  if (f.args) f.args.split(/, (?=\w+=)/).forEach(kv => { const i = kv.indexOf('='); r.push([kv.slice(0, i), human(kv.slice(i + 1)), '']); });
  if (f.ret) r.push([f.ok ? 'return' : 'revert', f.ok ? human(f.ret) : f.ret, f.ok ? 'ret' : 'bad']);
  if (f.gas != null && f.kind !== 'EVENT') r.push(['gas', f.gas.toLocaleString(), 'dim']);
  return r;
}
function renderGraph(){
  const t = D.tests[cur];
  const vis = t.frames.map((f, i) => ({f, i})).filter(({f}) => !hide.has(kindOf(f)));
  const stack = [], kids = new Map(), roots = [];
  vis.forEach(n => { while (stack.length && stack.at(-1).f.d >= n.f.d) stack.pop();
    const p = stack.at(-1); if (p) { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(n); } else roots.push(n); stack.push(n); });
  graph.querySelectorAll('.gn').forEach(x => x.remove());
  vis.forEach(n => { const f = n.f, k = kindOf(f), el = document.createElement('div');
    el.className = 'gn' + (f.ok ? '' : ' rev'); el.dataset.i = n.i;
    el.innerHTML = `<div class="gh"><span class="ty ${k}">${k}</span><span class="c">${esc(f.to)}</span>.<span class="f">${esc(f.fn)}</span></div>` +
      rowsOf(f).map(([a, b, c]) => `<div class="gr"><span class="k">${esc(a)}:</span><span class="v ${c}">${esc(b)}</span></div>`).join('');
    graph.appendChild(el); n.el = el; n.w = el.offsetWidth; n.h = el.offsetHeight; });
  // tidy tree, left → right: leaves stack down, parents centre on their children
  const COLW = 400, GAP = 26; let y = 0;
  const place = (n, depth) => { n.x = depth * COLW; const ch = kids.get(n) || [];
    if (!ch.length) { n.y = y; y += n.h + GAP; return; }
    ch.forEach(c => place(c, depth + 1));
    const a = ch[0], b = ch.at(-1); n.y = ((a.y + a.h/2) + (b.y + b.h/2)) / 2 - n.h/2; };
  roots.forEach(r => place(r, 0));
  const cols = {}; vis.forEach(n => (cols[n.x] ||= []).push(n));
  Object.values(cols).forEach(c => { c.sort((p, q) => p.y - q.y); for (let i = 1; i < c.length; i++) c[i].y = Math.max(c[i].y, c[i-1].y + c[i-1].h + GAP); });
  const minY = Math.min(...vis.map(n => n.y)); vis.forEach(n => n.y -= minY);
  vis.forEach(n => { n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; });
  gedges.innerHTML = vis.flatMap(p => (kids.get(p) || []).map(c => {
    const x1 = p.x + p.w, y1 = p.y + 17, x2 = c.x, y2 = c.y + 17, m = (x1 + x2) / 2;
    const k = kindOf(c.f), lab = k === 'EVENT' ? 'emits' : k === 'VM' ? 'cheatcode' : k === 'REVERT' ? 'reverts' : c.f.kind.toLowerCase();
    return `<path class="gedge" d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}"/><text class="glab" x="${m}" y="${(y1+y2)/2 - 4}" text-anchor="middle">${lab}</text>`; })).join('');
  graph.dataset.w = Math.max(...vis.map(n => n.x + n.w)); graph.dataset.h = Math.max(...vis.map(n => n.y + n.h));
  gapply();
}
graph.addEventListener('click', e => { const n = e.target.closest('.gn'); if (!n || gmoved) return;
  graph.querySelectorAll('.gn.sel').forEach(x => x.classList.remove('sel')); n.classList.add('sel'); openFrame(+n.dataset.i); });
function gapply(){ graph.style.transform = `translate(${gv.x}px,${gv.y}px) scale(${gv.k})`;
  gvp.style.backgroundSize = `${22*gv.k}px ${22*gv.k}px`; gvp.style.backgroundPosition = `${gv.x}px ${gv.y}px`; }
function gfit(){ const w = +graph.dataset.w || 1, h = +graph.dataset.h || 1;
  gv.k = Math.min(1.1, (gvp.clientWidth - 40) / w, (gvp.clientHeight - 40) / h); gv.x = 20; gv.y = Math.max(20, (gvp.clientHeight - h * gv.k) / 2); gapply(); }
function gzoom(f, mx = gvp.clientWidth/2, my = gvp.clientHeight/2){ const k = Math.min(2.5, Math.max(.25, gv.k * f));
  gv.x = mx - (mx - gv.x) * k / gv.k; gv.y = my - (my - gv.y) * k / gv.k; gv.k = k; gapply(); }
gvp.addEventListener('wheel', e => { e.preventDefault(); const r = gvp.getBoundingClientRect(); gzoom(Math.exp(-e.deltaY*.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
let gdrag = null, gmoved = false;
gvp.addEventListener('pointerdown', e => { if (e.target.closest('.gzoom')) return; gdrag = [e.clientX, e.clientY, gv.x, gv.y]; gmoved = false; });
addEventListener('pointermove', e => { if (!gdrag) return; const dx = e.clientX - gdrag[0], dy = e.clientY - gdrag[1];
  if (Math.abs(dx) + Math.abs(dy) > 4) { gmoved = true; gvp.classList.add('drag'); } gv.x = gdrag[2] + dx; gv.y = gdrag[3] + dy; gapply(); });
addEventListener('pointerup', () => { gdrag = null; gvp.classList.remove('drag'); setTimeout(() => gmoved = false); });
document.getElementById('gzi').onclick = () => gzoom(1.25); document.getElementById('gzo').onclick = () => gzoom(.8); document.getElementById('gzf').onclick = gfit;

function renderFlow(){
  const t = D.tests[cur];
  document.getElementById('xfers').innerHTML = t.transfers.length ? `<table>${t.transfers.map((x, i) =>
    `<tr><td style="color:var(--dim)">[${i+1}]</td><td>${esc(x.from)} → ${esc(x.to)}</td><td class="n">${human(x.value)} ${esc(x.token)}</td></tr>`).join('')}</table>` : '<div class="empty">No token transfers in this test.</div>';
  const net = {};
  t.transfers.forEach(x => { const v = BigInt(x.value); net[x.from] = (net[x.from] || 0n) - v; net[x.to] = (net[x.to] || 0n) + v; });
  const rows = Object.entries(net).filter(([a, v]) => v !== 0n && a !== '0x00000000…');
  document.getElementById('net').innerHTML = rows.length ? `<table>${rows.map(([a, v]) =>
    `<tr><td>${esc(a)}</td><td class="n ${v > 0n ? 'pos' : 'neg'}">${v > 0n ? '+' : '−'}${human((v < 0n ? -v : v).toString())}</td></tr>`).join('')}</table>` : '<div class="empty">Balances unchanged (or mint only).</div>';
}
</script>
